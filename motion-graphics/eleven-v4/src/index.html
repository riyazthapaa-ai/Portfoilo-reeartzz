<!doctype html>
<html><head><meta charset="utf-8"><title>Eleven v4 Motion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F4F3EF}
body{font-family:'Inter',sans-serif;color:#0B0B0C;-webkit-font-smoothing:antialiased}
#root{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0}
.scene{position:absolute;inset:0}
.c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.disp{font-family:'Inter Display','Inter',sans-serif}
.w{display:inline-block;white-space:pre}
.h1{font-family:'Inter Display';font-weight:700;font-size:168px;line-height:1;letter-spacing:-0.05em}
.h2{font-family:'Inter Display';font-weight:650;font-size:92px;line-height:1.05;letter-spacing:-0.04em;text-align:center}
.h3{font-family:'Inter Display';font-weight:600;font-size:60px;line-height:1.1;letter-spacing:-0.03em;text-align:center}
.sub{font-size:34px;font-weight:450;color:#6B6A66;letter-spacing:-0.01em;text-align:center}
.g{color:#A3A19B}
.pill{display:inline-flex;align-items:center;gap:14px;padding:14px 26px;border-radius:999px;background:#fff;border:1.5px solid rgba(0,0,0,.08);font-size:28px;font-weight:500;letter-spacing:-0.01em;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.dot{width:12px;height:12px;border-radius:50%;background:#0B0B0C}
.card{position:absolute;background:#fff;border-radius:32px;border:1.5px solid rgba(0,0,0,.06);box-shadow:0 2px 0 rgba(0,0,0,.02),0 30px 80px rgba(20,20,30,.08)}
.dark .card{background:#161618;border-color:rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mono{font-family:'DejaVu Sans Mono',monospace}
.tag{display:inline-block;font-family:'DejaVu Sans Mono',monospace;font-size:30px;padding:6px 14px;border-radius:12px;font-weight:600}
.kicker{font-size:26px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A8882}
.grad{background:linear-gradient(90deg,#3E6BFF,#9B5CFF 45%,#FF7A59);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600;letter-spacing:-0.01em}
.brand i{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 0deg,#7AA2FF,#C9A7FF,#FFC3A0,#9FE6D6,#7AA2FF)}
.prog{position:absolute;left:64px;right:64px;bottom:48px;height:3px;border-radius:3px;background:rgba(0,0,0,.07)}
.prog b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#0B0B0C}
.check{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#0B0B0C;color:#fff;font-size:30px;font-weight:700}
.x{background:#FF4D3D}
</style></head>
<body><div id="root"></div>
<script src="env.js"></script>
<script>
// ---------- helpers ----------
const FPS=30, DUR=171.5;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const E={
  out:p=>1-Math.pow(1-p,3),
  expo:p=>p>=1?1:1-Math.pow(2,-10*p),
  io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  back:p=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2)},
  lin:p=>p
};
let T=0;
const P=(s,d=.6,e=E.expo)=>e(clamp((T-s)/d));
function env(t){const i=t*FPS, a=Math.floor(i), f=i-a; const A=window.ENV[a]||0,B=window.ENV[a+1]||0; return A+(B-A)*f;}
// reveal style
function R(p,{y=46,blur=14,s=1,x=0}={}){
  const sc=s===1?1:lerp(s,1,p);
  return `opacity:${p};transform:translate(${(1-p)*x}px,${(1-p)*y}px) scale(${sc});filter:blur(${(1-p)*blur}px);`;
}
// word-by-word text; *x* = accent gradient, ~x~ = gray. times: array of start times or (start,stagger)
function words(str,start,stagger=.07,o={}){
  const parts=str.split(' ');
  return parts.map((w,i)=>{
    const st=Array.isArray(start)?(start[i]??start[start.length-1]):start+i*stagger;
    let cls='w';
    if(/^\*.*\*[.,!?]?$/.test(w)){cls+=' grad';w=w.replace(/\*/g,'')}
    else if(/^~.*~[.,!?]?$/.test(w)){cls+=' g';w=w.replace(/~/g,'')}
    const p=P(st,o.d||.55);
    return `<span class="${cls}" style="${R(p,{y:o.y??50,blur:o.blur??16})}">${w}${i<parts.length-1?' ':''}</span>`;
  }).join('');
}
// count-up number
function count(a,b,s,d,dec=0){const p=P(s,d,E.out);return (a+(b-a)*p).toFixed(dec);}
// noise
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function smoothNoise(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u);}
// orb
function orb(size,t,{hue=0,level=0,c=['#6E97FF','#B892FF','#FFB38A','#8EE3CF']}={}){
  const sc=1+level*0.06;
  const r=t*38+hue;
  return `<div style="position:relative;width:${size}px;height:${size}px;transform:scale(${sc});">
   <div style="position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,${c[1]}55,transparent 62%);filter:blur(${size*.08}px);opacity:${.55+level*.4}"></div>
   <div style="position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:inset 0 -${size*.06}px ${size*.12}px rgba(0,0,0,.10), 0 ${size*.08}px ${size*.2}px rgba(60,60,120,.18);">
     <div style="position:absolute;inset:-30%;background:conic-gradient(from ${r}deg,${c[0]},${c[1]},${c[2]},${c[3]},${c[0]});filter:blur(${size*.09}px);"></div>
     <div style="position:absolute;width:70%;height:70%;left:${15+Math.sin(t*.9+hue)*14}%;top:${10+Math.cos(t*.7+hue)*12}%;border-radius:50%;background:${c[3]};filter:blur(${size*.14}px);opacity:.8"></div>
     <div style="position:absolute;width:60%;height:60%;left:${30+Math.cos(t*1.1+hue)*16}%;top:${35+Math.sin(t*.8+hue)*14}%;border-radius:50%;background:${c[0]};filter:blur(${size*.14}px);opacity:.75"></div>
     <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85),rgba(255,255,255,0) 38%)"></div>
   </div></div>`;
}
// waveform bars (svg)
function bars(n,w,h,t,{gap=.45,color='#0B0B0C',amp=1,seed=0,flat=0,mode='live',reveal=1,colors=null}={}){
  const bw=w/n*(1-gap);let out='';
  for(let i=0;i<n;i++){
    const u=i/(n-1);
    if(u>reveal) break;
    let v;
    const nz=smoothNoise(i*.55+seed+t*5)*.65+smoothNoise(i*1.7+seed*3-t*3)*.35;
    if(mode==='live'){ v=(.12+.88*nz)*amp*(0.35+0.65*Math.sin(Math.PI*u)); }
    else { v=(.15+.85*smoothNoise(i*.6+seed))*amp*(0.4+0.6*Math.sin(Math.PI*u)); }
    v=lerp(v,.04,flat);
    const bh=Math.max(bw,v*h);
    const col=colors?colors(u):color;
    out+=`<rect x="${(i*(w/n)).toFixed(1)}" y="${((h-bh)/2).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${bw/2}" fill="${col}"/>`;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible">${out}</svg>`;
}
function mixColor(a,b,p){const pa=a.match(/\w\w/g).map(x=>parseInt(x,16)),pb=b.match(/\w\w/g).map(x=>parseInt(x,16));return '#'+pa.map((v,i)=>Math.round(lerp(v,pb[i],p)).toString(16).padStart(2,'0')).join('');}
const abs=(x,y,inner,extra='')=>`<div style="position:absolute;left:${x}px;top:${y}px;${extra}">${inner}</div>`;
const center=(x,y,inner,extra='')=>`<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);${extra}">${inner}</div>`;

// ---------- scenes ----------
// each: [start,end,fn,dark]
const S=[];
const scene=(a,b,fn,dark=false)=>S.push({a,b,fn,dark});

// 1. HOOK — ElevenLabs just released Eleven v4
scene(0,6.45,t=>{
  const lv=env(t);
  const slam=P(2.0,.5,E.back);
  const orbIn=P(0,1.2,E.expo);
  const orbMove=P(3.55,.9,E.io);
  const lbIn=P(3.7,.8,E.expo);
  let h=center(960,lerp(470,300,orbMove),`<div style="${R(orbIn,{y:0,blur:30,s:.2})}">${orb(lerp(300,200,orbMove),t,{level:lv})}</div>`);
  h+=center(960,lerp(150,95,orbMove),`<div class="pill" style="${R(P(.4,.7))}"><span class="dot" style="background:#FF4D3D;box-shadow:0 0 0 ${6+Math.sin(t*8)*3}px rgba(255,77,61,.18)"></span>${words('ElevenLabs just released',[.44,.94,1.3,1.62],0,{y:20,blur:8})}</div>`);
  // big title
  const titleY=lerp(800,500,orbMove);
  h+=center(960,titleY,`<div class="h1" style="opacity:${clamp(slam*1.4)};transform:scale(${lerp(1.6,1,slam)*lerp(1,.62,orbMove)});filter:blur(${(1-clamp(slam))*20}px);white-space:nowrap">Eleven <span class="grad">v4</span></div>`);
  // leaderboard
  if(T>3.5){
    const rows=[['#1','Eleven v4',1],['#2','',.86],['#3','',.79],['#4','',.71]];
    let rh='';
    rows.forEach((r,i)=>{
      const p=P(3.9+i*.12,.6);
      const isTop=i===0;
      const fill=P(4.5+i*.08,1.1,E.out)*r[2];
      rh+=`<div style="display:flex;align-items:center;gap:26px;height:78px;padding:0 30px;border-radius:20px;${isTop?'background:#0B0B0C;color:#fff;':''}${R(p,{y:30,blur:8})}">
       <div style="width:60px;font-weight:700;font-size:30px;${isTop?'':'color:#A3A19B'}">${r[0]}</div>
       <div style="width:230px;font-weight:600;font-size:30px">${r[1]||`<div style="height:16px;width:${150-i*20}px;border-radius:8px;background:#E7E5DF"></div>`}</div>
       <div style="flex:1;height:12px;border-radius:6px;background:${isTop?'rgba(255,255,255,.15)':'#EFEDE8'}"><div style="height:100%;width:${fill*100}%;border-radius:6px;background:${isTop?'linear-gradient(90deg,#6E97FF,#B892FF,#FFB38A)':'#CFCCC4'}"></div></div>
      </div>`;
    });
    h+=center(960,lerp(1100,800,lbIn),`<div style="width:980px;padding:24px;background:#fff;border-radius:34px;border:1.5px solid rgba(0,0,0,.06);box-shadow:0 30px 80px rgba(20,20,30,.08);opacity:${lbIn}">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 30px 16px"><span class="kicker">Voice model ranking</span><span style="font-size:24px;color:#8A8882;${R(P(5.4,.5),{y:10,blur:4})}">in the world 🌍</span></div>${rh}</div>`);
  }
  return h;
});

// 2. Features
scene(6.35,12.75,t=>{
  const lv=env(t);
  const items=[
    {s:6.54,k:'01',title:'Understands<br>emotion',vis:()=>`<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${['[excited]','[sad]','[whispers]'].map((x,i)=>`<span class="tag" style="background:${['#FFE9DF','#E4ECFF','#EFE6FF'][i]};color:${['#C2410C','#2747C9','#6D3FD1'][i]};font-size:24px;${R(P(7+i*.18,.5),{y:20,blur:6})}">${x}</span>`).join('')}</div>`},
    {s:8.14,k:'02',title:'Clones a voice<br>from ~10 seconds',vis:()=>`<div style="display:flex;align-items:center;gap:18px">${bars(26,240,90,T,{amp:.5+lv*.7,seed:2,reveal:P(8.6,1.6,E.lin)})}<span style="font-size:40px;font-weight:700">${count(0,10,8.9,1.2)}s</span></div>`},
    {s:11.06,k:'03',title:'Speaks<br>90+ languages',vis:()=>`<div style="font-family:'Inter Display';font-size:92px;font-weight:700;letter-spacing:-.04em">${count(0,90,11.3,1.0)}<span class="grad">+</span></div>`},
  ];
  let h='';
  items.forEach((it,i)=>{
    const p=P(it.s,.8,E.expo);
    const x=330+i*630;
    h+=center(x,540,`<div style="width:560px;height:620px;background:#fff;border-radius:36px;border:1.5px solid rgba(0,0,0,.06);box-shadow:0 30px 80px rgba(20,20,30,.08);padding:44px;display:flex;flex-direction:column;justify-content:space-between;${R(p,{y:120,blur:20})}">
     <div style="display:flex;justify-content:space-between;align-items:center"><span class="kicker">${it.k}</span>${orb(54,T,{hue:i*120,level:lv*.5})}</div>
     <div style="height:200px;display:flex;align-items:center;justify-content:center">${T>it.s?it.vis():''}</div>
     <div class="h3" style="text-align:left;font-size:58px">${it.title}</div></div>`);
  });
  return h;
});

// 3. Agenda
scene(12.65,17.25,t=>{
  const list=[['Everything it can do',12.9],['What it costs',14.6],['Who should actually use it',15.6]];
  let h=center(960,250,`<div class="kicker" style="${R(P(12.8,.5),{y:20})}">In this video</div>`);
  list.forEach(([txt,s],i)=>{
    const p=P(s,.6);
    const ck=P(s+.25,.4,E.back);
    h+=abs(520,360+i*150,`<div style="display:flex;align-items:center;gap:34px;${R(p,{x:-60,y:0})}">
      <div class="check" style="transform:scale(${ck})">✓</div>
      <div class="h3" style="text-align:left;font-size:68px">${txt}</div></div>`);
  });
  return h;
});

// 4. The problem (dark)
scene(17.15,29.5,t=>{
  let h='';
  const head=P(17.5,.7);
  const headUp=P(20.1,.8,E.io);
  h+=center(960,lerp(540,200,headUp),`<div class="h2" style="color:#fff;transform:scale(${lerp(1,.66,headUp)})">${words('AI voices have always had the ~same~ ~problem.~',[17.55,17.85,18.05,18.6,18.87,19.09,19.23,19.5],0)}</div>`);
  if(T>20){
    // left: read words ✓ / miss feeling ✗ ; then script excited -> flat
    const a=P(20.2,.6),b=P(21.45,.6);
    h+=abs(200,330,`<div style="display:flex;flex-direction:column;gap:26px">
      <div style="display:flex;align-items:center;gap:24px;color:#fff;${R(a,{x:-40,y:0})}"><span class="check" style="background:#fff;color:#000;width:50px;height:50px;font-size:26px">✓</span><span style="font-size:44px;font-weight:600">Reads the words</span></div>
      <div style="display:flex;align-items:center;gap:24px;color:#fff;${R(b,{x:-40,y:0})}"><span class="check x" style="width:50px;height:50px;font-size:26px">✕</span><span style="font-size:44px;font-weight:600">Misses the feeling</span></div></div>`);
    // excited line card
    const c=P(22.6,.7);
    const flat=P(24.4,.6,E.io);
    h+=abs(1000,300,`<div style="width:720px;padding:34px;border-radius:30px;background:#161618;border:1.5px solid rgba(255,255,255,.08);${R(c,{y:60})}">
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:22px"><span class="tag" style="background:#3A2A1E;color:#FFB38A;font-size:24px">[excited]</span><span style="color:#fff;font-size:34px;font-weight:600">“We actually won!”</span></div>
      <div style="height:120px;display:flex;align-items:center">${bars(48,650,120,T,{amp:.9,seed:5,flat,colors:u=>mixColor('ffb38a','55555a',flat)})}</div>
      <div style="display:flex;justify-content:space-between;color:#8A8882;font-size:24px;margin-top:14px"><span>expected: excited</span><span style="color:${flat>.5?'#FF6B5C':'#8A8882'};font-weight:600">result: ${flat>.5?'flat':'…'}</span></div></div>`);
  }
  if(T>25.3){
    // drift timeline
    const d=P(25.4,.7);
    const prog=P(25.9,3.2,E.lin);
    const match=Math.round(lerp(98,61,P(26.6,2.4,E.io)));
    const n=90;
    h+=center(960,850,`<div style="width:1520px;padding:30px 40px;border-radius:30px;background:#161618;border:1.5px solid rgba(255,255,255,.08);${R(d,{y:60})}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:#fff"><span style="font-size:28px;font-weight:600">Long generation · 12:40</span>
      <span style="font-size:28px">Voice match <b style="color:${match>85?'#8EE3CF':match>72?'#FFC46B':'#FF6B5C'};font-size:36px">${match}%</b></span></div>
      ${bars(n,1440,90,T*.5,{amp:.75,seed:9,mode:'static',reveal:prog,colors:u=>mixColor('6e97ff','ff6b5c',clamp(u*1.2))})}
      <div style="margin-top:14px;text-align:right;color:#FF6B5C;font-size:26px;font-weight:600;${R(P(28.4,.5),{y:10,blur:4})}">doesn't sound like the same person</div></div>`);
  }
  return h;
},true);

// 5. built to fix
scene(29.4,32.85,t=>{
  const lv=env(t);
  let h=center(960,330,`<div style="${R(P(29.5,1),{y:0,s:.4,blur:30})}">${orb(260,t,{level:lv})}</div>`);
  h+=center(960,700,`<div class="h2" style="white-space:nowrap">${words('Eleven v4 is built to fix *exactly* *that.*',[29.91,30.3,30.81,31.01,31.25,31.49,31.95,32.3],0)}</div>`);
  return h;
});

// 6. newest TTS model, end of September
scene(32.75,38.5,t=>{
  let h=center(960,330,`<div class="kicker" style="${R(P(33,.5),{y:20})}">What is it?</div>`);
  h+=center(960,470,`<div class="h2" style="white-space:nowrap">${words("ElevenLabs' *newest* text-to-speech model",[34.65,35.03,35.41,36.29],0)}</div>`);
  const c=P(36.8,.7);
  const day=Math.round(lerp(1,30,P(37.2,.9,E.out)));
  h+=center(960,730,`<div class="pill" style="font-size:34px;padding:20px 34px;${R(c,{y:40})}"><span style="font-size:34px">📅</span> Released <b>end of September</b>
   <span style="display:inline-flex;gap:4px;margin-left:10px">${Array.from({length:10},(_,i)=>`<i style="width:10px;height:28px;border-radius:5px;background:${i<Math.ceil(day/3)?'#0B0B0C':'#E7E5DF'}"></i>`).join('')}</span></div>`);
  return h;
});

// 7. two versions
scene(38.4,53.35,t=>{
  const lv=env(t);
  let h=center(960,140,`<div class="h3">${words('It comes in *two* *versions.*',[38.61,38.81,39.03,39.21,39.57],0)}</div>`);
  const c1=P(40.2,.8), c2=P(46.1,.8);
  const tags=[['🎙️ Voiceovers',42.67],['📚 Audiobooks',43.29],['▶️ YouTube narration',44.21]];
  const dim1=P(46,.6,E.io);
  h+=abs(150,260,`<div style="width:780px;height:700px;background:#fff;border-radius:40px;border:1.5px solid rgba(0,0,0,.06);box-shadow:0 30px 80px rgba(20,20,30,.08);padding:50px;display:flex;flex-direction:column;gap:30px;${R(c1,{y:120})};opacity:${c1*lerp(1,.55,dim1)}">
    <div style="display:flex;align-items:center;gap:26px">${orb(110,t,{level:T<46?lv:0})}<div><div class="kicker">Quality</div><div class="disp" style="font-size:66px;font-weight:700;letter-spacing:-.04em">Eleven v4</div></div></div>
    <div style="font-size:32px;color:#6B6A66;line-height:1.35">Built for the best-sounding long-form audio.</div>
    <div style="display:flex;flex-direction:column;gap:16px;margin-top:6px">${tags.map(([x,s])=>`<div class="pill" style="align-self:flex-start;font-size:32px;${R(P(s,.5),{x:-40,y:0})}">${x}</div>`).join('')}</div></div>`);
  if(T>46){
    const lat=P(51.6,1,E.out);
    h+=abs(990,260,`<div style="width:780px;height:700px;background:#0B0B0C;color:#fff;border-radius:40px;box-shadow:0 30px 80px rgba(20,20,30,.2);padding:50px;display:flex;flex-direction:column;gap:30px;${R(c2,{y:120})}">
      <div style="display:flex;align-items:center;gap:26px">${orb(110,t*2.2,{level:lv,c:['#3BE0C0','#5B8CFF','#B8FF6B','#2BD4FF']})}<div><div class="kicker" style="color:#9A9890">Speed</div><div class="disp" style="font-size:66px;font-weight:700;letter-spacing:-.04em">v4 Turbo</div></div></div>
      <div style="font-size:32px;color:#A3A19B;line-height:1.35">Built for real-time conversation.</div>

// ---------- render ----------
function render(t){
  T=t;
  let dark=0;
  for(const s of S){ if(s.dark){ const fi=clamp((t-s.a)/.5), fo=clamp((s.b-t)/.5); dark=Math.max(dark,Math.min(fi,fo)); } }
  const bgc=mixColor('f4f3ef','0b0b0c',E.io(dark));
  let html=`<div class="bg" style="background:radial-gradient(120% 90% at 50% 0%,${mixColor('ffffff','1a1a1e',E.io(dark))} 0%,${bgc} 60%)"></div>`;
  // ambient blobs
  html+=`<div style="position:absolute;width:900px;height:900px;left:${-250+Math.sin(t*.13)*120}px;top:${-350+Math.cos(t*.11)*90}px;border-radius:50%;background:radial-gradient(circle,rgba(150,170,255,${.22-dark*.1}),transparent 65%)"></div>
           <div style="position:absolute;width:900px;height:900px;right:${-300+Math.cos(t*.12)*120}px;bottom:${-420+Math.sin(t*.1)*90}px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,150,${.2-dark*.1}),transparent 65%)"></div>`;
  for(const s of S){
    if(t<s.a-0.01||t>s.b+0.01) continue;
    const pin=clamp((t-s.a)/.45), pout=clamp((s.b-t)/.4);
    const op=Math.min(E.out(pin),E.out(pout));
    const sc=lerp(.97,1,E.out(pout))*lerp(1.02,1,E.out(pin));
    const bl=(1-pout)*12;
    html+=`<div class="scene ${s.dark?'dark':''}" style="opacity:${op};transform:scale(${sc});filter:blur(${bl}px)">${s.fn(t)}</div>`;
  }
  // brand + progress
  const fg=dark>.5?'#fff':'#0B0B0C';
  html+=`<div class="brand" style="color:${fg};opacity:${t<0.6?clamp(t/0.6):1}"><i></i>Eren AI</div>`;
  html+=`<div class="prog" style="background:${dark>.5?'rgba(255,255,255,.1)':'rgba(0,0,0,.07)'}"><b style="width:${clamp(t/169.8)*100}%;background:${fg}"></b></div>`;
  document.getElementById('root').innerHTML=html;
}
window.render=render;
const q=new URLSearchParams(location.search); if(q.has('t')) render(parseFloat(q.get('t'))); else render(0);
