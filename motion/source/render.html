<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500;600&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, FPS = 30, DUR = 14;
const C = document.getElementById('c'), x = C.getContext('2d');
const BLACK = '#0a0a0a', CREAM = '#f2ede8', RED = '#e3170f', DIM = 'rgba(242,237,232,0.45)';
const SERIF = '"Cormorant Garamond", serif', SANS = 'Jost, sans-serif';

// easing
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = p => 1 - Math.pow(1 - p, 4);
const eIn = p => p * p * p;
const eIO = p => p < .5 ? 8 * p ** 4 : 1 - Math.pow(-2 * p + 2, 4) / 2;
const eBack = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;

function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }
let ART = [], LOGO, GRAIN = [];

function makeGrain() {
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = 480; g.height = 270;
    const gx = g.getContext('2d'), d = gx.createImageData(480, 270);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    gx.putImageData(d, 0, 0); GRAIN.push(g);
  }
}

function text(str, px, py, font, color, align = 'left', spacing = 0) {
  x.font = font; x.fillStyle = color; x.textAlign = align; x.textBaseline = 'alphabetic';
  x.letterSpacing = spacing + 'px'; x.fillText(str, px, py); x.letterSpacing = '0px';
}
// draw text revealed through a mask: slides up from below a baseline clip
function maskedLine(str, px, py, font, color, p, align = 'left', spacing = 0, h = 260) {
  x.save(); x.beginPath(); x.rect(0, py - h, W, h + h * 0.28); x.clip();
  text(str, px, py + (1 - p) * h * 1.05, font, color, align, spacing); x.restore();
}
function cover(img, cx, cy, w, h, scale = 1) {
  const s = Math.max(w / img.width, h / img.height) * scale;
  const iw = img.width * s, ih = img.height * s;
  x.drawImage(img, cx - iw / 2, cy - ih / 2, iw, ih);
}

// ---------- SCENE A: name intro (0 - 3.4) ----------
function sceneA(t) {
  x.fillStyle = BLACK; x.fillRect(0, 0, W, H);
  const cy = 560;
  // red line draws out from center, then retracts
  const lp = eIO(prog(t, 0.1, 0.9)), lr = eIO(prog(t, 2.4, 2.9));
  const half = 760 * lp * (1 - lr);
  x.fillStyle = RED; x.fillRect(W / 2 - half, cy + 40, half * 2, 3);

  const out = eIn(prog(t, 2.55, 3.0));
  x.save(); x.translate(0, -out * 40); x.globalAlpha = 1 - out;
  // RIYAZ letters, staggered
  const letters = 'RIYAZ'.split('');
  x.font = `300 300px ${SERIF}`; x.letterSpacing = '-6px';
  const full = x.measureText('RIYAZ ').width + (x.font = `italic 300 300px ${SERIF}`, x.measureText('Thapa').width);
  let px = W / 2 - full / 2;
  letters.forEach((ch, i) => {
    x.font = `300 300px ${SERIF}`;
    const p = eOut(prog(t, 0.55 + i * 0.07, 1.35 + i * 0.07));
    maskedLine(ch, px, cy, `300 300px ${SERIF}`, CREAM, p, 'left', -6, 300);
    x.font = `300 300px ${SERIF}`; x.letterSpacing = '-6px';
    px += x.measureText(ch).width;
  });
  x.font = `300 300px ${SERIF}`; px += x.measureText(' ').width;
  const pT = eOut(prog(t, 1.0, 1.9));
  maskedLine('Thapa', px, cy, `italic 300 300px ${SERIF}`, DIM, pT, 'left', -6, 300);
  // sub label
  const sp = eOut(prog(t, 1.5, 2.2));
  x.globalAlpha *= sp;
  text('GRAPHIC DESIGNER  /  VIDEO EDITOR  /  MOTION GRAPHICS', W / 2, cy + 120 + (1 - sp) * 14, `400 26px ${SANS}`, DIM, 'center', 12);
  x.restore();

  // corner frame marks
  const fm = eOut(prog(t, 0.3, 1.2)) * (1 - out);
  x.globalAlpha = fm; corners(70, 22, CREAM); x.globalAlpha = 1;
  text('REARTZ — PORTFOLIO 2026', 110, 120, `400 18px ${SANS}`, `rgba(242,237,232,${0.5 * fm})`, 'left', 8);
  text('NEPAL', W - 110, H - 100, `400 18px ${SANS}`, `rgba(242,237,232,${0.5 * fm})`, 'right', 8);
}
function corners(m, len, col) {
  x.strokeStyle = col; x.lineWidth = 2;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([a, b, sx, sy]) => {
    x.beginPath(); x.moveTo(a, b + sy * len); x.lineTo(a, b); x.lineTo(a + sx * len, b); x.stroke();
  });
}

// ---------- SCENE B: kinetic skills (3.4 - 7.3) ----------
const SKILLS = [
  { a: 'GRAPHIC', b: 'Design', bg: CREAM, fg: BLACK, acc: RED },
  { a: 'VIDEO', b: 'Editing', bg: BLACK, fg: CREAM, acc: RED },
  { a: 'MOTION', b: 'Graphics', bg: RED, fg: BLACK, acc: CREAM },
];
function sceneB(t) {
  const lt = t - 3.4, seg = 1.3;
  const i = Math.min(2, Math.floor(lt / seg)), st = lt - i * seg, s = SKILLS[i];
  // background wipe in from the bottom per segment
  const prev = i === 0 ? { bg: BLACK } : SKILLS[i - 1];
  x.fillStyle = prev.bg; x.fillRect(0, 0, W, H);
  const wp = eIO(prog(st, 0, 0.4));
  x.fillStyle = s.bg; x.fillRect(0, H * (1 - wp), W, H * wp);
  if (wp < 1) return;

  const inP = eOut(prog(st, 0.3, 0.85)), outP = i < 2 ? 0 : 0;
  // giant outlined number behind
  x.save(); x.globalAlpha = 0.12 * inP;
  x.font = `600 760px ${SANS}`; x.textAlign = 'right'; x.lineWidth = 3; x.strokeStyle = s.fg;
  x.strokeText('0' + (i + 1), W - 60 + (1 - inP) * 200, H - 60); x.restore();

  const zoom = 1 + st * 0.03;
  x.save(); x.translate(W / 2, H / 2); x.scale(zoom, zoom); x.translate(-W / 2, -H / 2);
  maskedLine(s.a, 150, 560, `600 250px ${SANS}`, s.fg, inP, 'left', 4, 250);
  const p2 = eOut(prog(st, 0.42, 0.97));
  maskedLine(s.b, 158, 790, `italic 300 220px ${SERIF}`, s.fg, p2, 'left', -2, 230);
  x.restore();
  // accent bar
  const bp = eOut(prog(st, 0.5, 1.0));
  x.fillStyle = s.acc; x.fillRect(158, 860, 420 * bp, 10);
  // counter
  text(`0${i + 1} / 03`, W - 150, 140, `400 24px ${SANS}`, s.fg, 'right', 8);
  text('SERVICES', 150, 140, `400 24px ${SANS}`, s.fg, 'left', 10);
}

// ---------- SCENE C: artwork montage (7.3 - 10.9) ----------
function sceneC(t) {
  const lt = t - 7.3;
  x.fillStyle = BLACK; x.fillRect(0, 0, W, H);
  if (lt < 1.5) {
    // three vertical strips reveal from center, slight parallax
    const sw = W / 3;
    for (let k = 0; k < 3; k++) {
      const p = eIO(prog(lt, 0.0 + k * 0.12, 0.7 + k * 0.12));
      const h = H * p, y0 = k % 2 ? 0 : H - h;
      x.save(); x.beginPath(); x.rect(k * sw + 6, y0, sw - 12, h); x.clip();
      x.filter = 'grayscale(1) brightness(0.8)';
      cover(ART[k], k * sw + sw / 2, H / 2 + (k % 2 ? -1 : 1) * 40 * (1 - lt / 1.5), sw, H, 1.15 - lt * 0.05);
      x.filter = 'none';
      // color bleeds in
      x.globalAlpha = eOut(prog(lt, 0.8, 1.4));
      cover(ART[k], k * sw + sw / 2, H / 2 + (k % 2 ? -1 : 1) * 40 * (1 - lt / 1.5), sw, H, 1.15 - lt * 0.05);
      x.restore();
    }
    const tp = eOut(prog(lt, 0.7, 1.2));
    x.fillStyle = `rgba(10,10,10,${0.55 * tp})`; x.fillRect(0, H - 170, W, 170);
    maskedLine('Visuals that capture attention.', W / 2, H - 70, `italic 300 64px ${SERIF}`, CREAM, tp, 'center', 0, 80);
    return;
  }
  // fullscreen hard cuts with punch-in
  const ft = lt - 1.5, seg = 0.7, k = Math.min(2, Math.floor(ft / seg)), st = ft - k * seg;
  const punch = 1.12 - eOut(prog(st, 0, seg)) * 0.08;
  cover(ART[k], W / 2, H / 2, W, H, punch);
  // red flash frame on cut
  const fl = 1 - prog(st, 0, 0.12);
  if (fl > 0) { x.fillStyle = `rgba(227,23,15,${0.55 * fl})`; x.fillRect(0, 0, W, H); }
  x.strokeStyle = CREAM; x.lineWidth = 2; corners(60, 40, CREAM);
  text(['SABAI — TYPE', 'GROUP 04 — ILLUSTRATION', 'HAHAHA — DIGITAL ART'][k], 100, H - 90, `500 22px ${SANS}`, CREAM, 'left', 8);
  text(`0${k + 1}`, W - 100, H - 90, `italic 300 54px ${SERIF}`, CREAM, 'right');
  // exit: circle iris close into black at the end
  const ir = prog(t, 10.4, 10.9);
  if (ir > 0) {
    x.save(); x.fillStyle = BLACK; x.beginPath(); x.rect(0, 0, W, H);
    x.arc(W / 2, H / 2, Math.hypot(W, H) / 2 * (1 - eIn(ir)), 0, Math.PI * 2, true); x.fill('evenodd'); x.restore();
  }
}

// ---------- SCENE D: logo end card (10.9 - 14) ----------
function sceneD(t) {
  const lt = t - 10.9;
  x.fillStyle = BLACK; x.fillRect(0, 0, W, H);
  const cx = W / 2, cy = 420;
  // rotating dashed ring
  const rp = eOut(prog(lt, 0, 0.8));
  x.save(); x.translate(cx, cy); x.rotate(lt * 0.6);
  x.strokeStyle = RED; x.lineWidth = 2; x.setLineDash([4, 14]);
  x.beginPath(); x.arc(0, 0, 230 * rp, 0, Math.PI * 2 * rp); x.stroke(); x.setLineDash([]);
  x.restore();
  // logo pop with overshoot + subtle bob
  const lp = eBack(prog(lt, 0.15, 0.75));
  const sz = 400 * Math.max(0, lp);
  if (sz > 0) {
    x.save(); x.translate(cx, cy + Math.sin(lt * 4) * 6); x.rotate((1 - clamp(lp)) * -0.4);
    x.beginPath(); x.arc(0, 0, sz * 0.5, 0, Math.PI * 2); x.clip(); x.fillStyle = "#000"; x.fill();
    x.drawImage(LOGO, -sz * 0.8, -sz * 0.8, sz * 1.6, sz * 1.6); x.restore();
  }
  // REARTZ wordmark tracking in
  const wp = eOut(prog(lt, 0.5, 1.5));
  x.save(); x.globalAlpha = wp;
  text('REARTZ', cx, 780, `300 120px ${SERIF}`, CREAM, 'center', lerp(80, 36, wp));
  x.restore();
  const sp = eOut(prog(lt, 1.0, 1.6));
  maskedLine('RIYAZ THAPA  ·  DESIGN  ·  EDIT  ·  MOTION', cx, 860, `400 24px ${SANS}`, DIM, sp, 'center', 10, 40);
  const lnp = eIO(prog(lt, 1.2, 1.9));
  x.fillStyle = RED; x.fillRect(cx - 200 * lnp, 905, 400 * lnp, 2);
  const ap = eOut(prog(lt, 1.5, 2.1));
  maskedLine('Based in Nepal — available worldwide', cx, 965, `italic 300 40px ${SERIF}`, CREAM, ap, 'center', 0, 50);
  // fade out
  const fo = prog(t, 13.5, 14);
  if (fo > 0) { x.fillStyle = `rgba(0,0,0,${fo})`; x.fillRect(0, 0, W, H); }
}

function render(t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.filter = 'none';
  if (t < 3.4) sceneA(t);
  else if (t < 7.3) sceneB(t);
  else if (t < 10.9) sceneC(t);
  else sceneD(t);
  // red sweep transition A -> B
  const sw = prog(t, 2.95, 3.65);
  if (sw > 0 && sw < 1) {
    const a = eIO(prog(sw, 0, 0.5)) * W, b = eIO(prog(sw, 0.5, 1)) * W;
    x.fillStyle = RED; x.fillRect(b, 0, a - b, H);
  }
  // film grain + vignette
  x.save(); x.globalAlpha = 0.07; x.globalCompositeOperation = 'overlay';
  x.drawImage(GRAIN[Math.floor(t * FPS) % GRAIN.length], 0, 0, W, H); x.restore();
  const v = x.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
}

window.ready = (async () => {
  await document.fonts.load(`300 100px "Cormorant Garamond"`);
  await document.fonts.load(`italic 300 100px "Cormorant Garamond"`);
  await document.fonts.load(`600 100px Jost`); await document.fonts.load(`400 100px Jost`);
  await document.fonts.load(`500 100px Jost`); await document.fonts.ready;
  ART = await Promise.all(['art1-sabai-font.png', 'art2-group4.png', 'art3-hahaha.png'].map(load));
  LOGO = await load('logo.png'); makeGrain(); render(0); return true;
})();
window.frame = (i) => { render(i / FPS); return C.toDataURL('image/jpeg', 0.95); };
window.META = { FPS, DUR };
</script></body></html>
