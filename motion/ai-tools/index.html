<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 Free AI Tools</title>
<style>
@font-face{font-family:'Space Grotesk';src:url(fonts/space-grotesk.woff2) format('woff2');font-weight:300 700}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jetbrains-mono.woff2) format('woff2');font-weight:100 800}
:root{--bg:#07070c;--fg:#f5f5f8;--mut:#8f8fa6;--card:#12121b;--card2:#191925;--line:#2a2a3d;--ac:#ff8a3d;--good:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--bg);overflow:hidden;font-family:Inter,sans-serif;color:var(--fg);transform-origin:0 0}
.a{position:absolute}
.scene{position:absolute;inset:0;display:none}
.disp{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;letter-spacing:-.02em}
.mono{font-family:'JetBrains Mono',monospace}

/* background */
#grid{position:absolute;inset:-80px;background-image:radial-gradient(circle,rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:44px 44px}
.glow{position:absolute;border-radius:50%;filter:blur(40px);opacity:.33}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
#bignum{position:absolute;right:-40px;bottom:-150px;font:700 760px/1 'Space Grotesk';color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.06);letter-spacing:-.06em}

/* hud */
#hud{position:absolute;left:120px;right:120px;top:56px;height:40px}
#hud .lbl{position:absolute;left:0;top:6px;font:600 20px 'JetBrains Mono';letter-spacing:.14em;color:var(--mut)}
#hud .lbl b{color:var(--fg)}
#dots{position:absolute;right:0;top:8px;display:flex;gap:10px}
#dots div{width:64px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
#dots i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0)}

/* wipe */
.wipe{position:absolute;top:-100px;height:1280px;width:2400px;left:0;transform:skewX(-14deg)}

/* captions */
#cap{position:absolute;left:0;right:0;bottom:64px;text-align:center;font:700 46px/1.2 'Space Grotesk';letter-spacing:-.01em;text-shadow:0 4px 24px rgba(0,0,0,.8)}
#cap span{display:inline-block;padding:2px 10px;border-radius:10px;margin:0 1px}

/* left column */
.left{position:absolute;left:120px;top:200px;width:700px}
.num{font:700 150px/1 'Space Grotesk';letter-spacing:-.05em;color:var(--ac)}
.tname{margin-top:18px;font:700 84px/1 'Space Grotesk';letter-spacing:-.035em;white-space:nowrap}
.tsub{margin-top:16px;font:500 28px/1.3 Inter;color:var(--mut)}
.pill{position:absolute;left:0;display:flex;align-items:center;gap:16px;height:64px;padding:0 26px 0 18px;border-radius:32px;background:var(--card2);border:1.5px solid var(--line);font:600 28px Inter;white-space:nowrap}
.pill .d{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 18px Inter;color:#07070c;background:var(--ac)}
.pill.bad .d{background:var(--bad)}
.pill.warn .d{background:var(--warn)}

/* generic */
.card{position:absolute;background:var(--card);border:1.5px solid var(--line);border-radius:28px;overflow:hidden}
.win-bar{height:52px;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 22px}
.win-bar i{width:13px;height:13px;border-radius:50%;background:#2e2e44}
.win-bar span{margin-left:14px;font:500 18px 'JetBrains Mono';color:var(--mut)}
.right{position:absolute;left:900px;top:190px;width:900px;height:720px}
.chip{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:22px;font:600 21px Inter;background:var(--card2);border:1.5px solid var(--line);white-space:nowrap}
.badge{position:absolute;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:800 46px Inter;color:#07070c;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.caret{display:inline-block;width:3px;height:1em;background:var(--ac);vertical-align:-.12em;margin-left:3px}
.icon{border-radius:26%;display:grid;place-items:center}
.icon svg{width:58%;height:58%}

/* intro */
.tcard{position:absolute;top:0;width:300px;height:250px;border-radius:30px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.tcard .nm{font:700 30px 'Space Grotesk';letter-spacing:-.02em}
.tcard .no{position:absolute;left:20px;top:16px;font:700 22px 'JetBrains Mono';color:var(--mut)}

/* goblin */
.gi-row{position:absolute;left:28px;right:28px;height:62px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);font:500 27px Inter}
.gi-row .cb{width:32px;height:32px;border-radius:9px;border:2.5px solid #4a4a66;display:grid;place-items:center;flex:none}
.gi-row .tm{margin-left:auto;font:600 21px 'JetBrains Mono';color:var(--ac);background:rgba(74,222,128,.12);padding:6px 14px;border-radius:12px}

/* posters */
.poster{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.plabel{position:absolute;font:600 22px 'JetBrains Mono';letter-spacing:.1em;color:var(--mut);text-transform:uppercase}

/* mascot frames */
.mframe{position:absolute;width:280px;height:210px;border-radius:22px;overflow:hidden;border:1.5px solid var(--line)}
.mframe svg.m{position:absolute;left:50%;bottom:6px;width:150px;height:150px;margin-left:-75px}
.mframe .tag{position:absolute;left:12px;top:12px;font:600 15px 'JetBrains Mono';background:rgba(0,0,0,.45);padding:4px 10px;border-radius:8px}

/* controls (preview only) */
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(10,10,16,.92);color:#ddd;font:14px Inter;z-index:10}
#ctl button{background:#ff8a3d;border:0;border-radius:8px;padding:8px 16px;font:700 14px Inter;cursor:pointer}
#ctl input[type=range]{flex:1}
body.render #ctl{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="glow" id="g1" style="width:900px;height:900px"></div>
  <div class="glow" id="g2" style="width:700px;height:700px"></div>
  <div id="bignum"></div>
  <div id="vign"></div>

  <!-- scenes are injected here -->
  <div id="scenes"></div>

  <div id="hud"><div class="lbl"><b>5</b> FREE AI TOOLS</div><div id="dots"></div></div>
  <div id="cap"></div>
  <div class="wipe" id="w1"></div>
  <div class="wipe" id="w2"></div>
</div>

<div id="ctl"><button id="play">Play</button><input id="scrub" type="range" min="0" max="118" step="0.01" value="0"><span id="tc" class="mono">0.00</span><label><input type="checkbox" id="capt" checked> captions</label></div>
<audio id="vo" src="voiceover.mp3" preload="auto"></audio>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- original mascot used in the Nano Banana scene -->
    <symbol id="mascot" viewBox="0 0 200 200">
      <line x1="100" y1="38" x2="100" y2="12" stroke="#e8e8f0" stroke-width="6" stroke-linecap="round"/>
      <circle cx="100" cy="12" r="11" fill="#facc15"/>
      <ellipse cx="100" cy="190" rx="58" ry="8" fill="rgba(0,0,0,.25)"/>
      <path d="M38 118 Q20 128 26 146" stroke="#2dd4bf" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M162 118 Q182 104 176 84" stroke="#2dd4bf" stroke-width="16" stroke-linecap="round" fill="none"/>
      <rect x="36" y="36" width="128" height="148" rx="62" fill="#2dd4bf"/>
      <rect x="52" y="56" width="96" height="66" rx="33" fill="#0f2f35"/>
      <circle cx="80" cy="89" r="13" fill="#fff"/><circle cx="120" cy="89" r="13" fill="#fff"/>
      <circle cx="83" cy="91" r="6" fill="#0f2f35"/><circle cx="123" cy="91" r="6" fill="#0f2f35"/>
      <path d="M86 108 Q100 118 114 108" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M50 138 Q100 160 150 138 L150 150 Q100 172 50 150Z" fill="#facc15"/>
      <circle cx="100" cy="168" r="6" fill="#0f2f35" opacity=".5"/>
    </symbol>
  </defs>
</svg>

<script src="data.js"></script>
<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const E={
  lin:t=>t,
  out:t=>1-Math.pow(1-t,3),
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  expo:t=>t>=1?1:1-Math.pow(2,-10*t),
  back:t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
};
let T=0;
const pr=(a,d=.5,e=E.out)=>e(clamp((T-a)/d));
// fade/slide/scale an element in at `a`, optionally out at `o`
function inn(el,a,{d=.55,x=0,y=34,s=1,r=0,blur=0,e=E.back,o=null,od=.35,ox=0,oy=-20,op=1}={}){
  if(!el)return;
  const k=pr(a,d,e), f=clamp((T-a)/(d*.5));
  let q=o==null?0:E.inOut(clamp((T-o)/od));
  el.style.opacity=f*(1-q)*op;
  el.style.visibility=(f*(1-q)>0.001)?'visible':'hidden';
  const tx=x*(1-k)+ox*q, ty=y*(1-k)+oy*q, sc=lerp(s,1,k), rot=r*(1-k);
  el.style.transform=`translate(${tx}px,${ty}px) scale(${sc}) rotate(${rot}deg)`;
  if(blur)el.style.filter=`blur(${blur*(1-pr(a,d,E.out))}px)`;
}
function type(el,text,a,cps=22,caret=true,until=1e9){
  const n=Math.floor(clamp((T-a)*cps,0,text.length));
  const blink=caret&&T<until&&(T<a+text.length/cps+.1||Math.floor(T*2.4)%2===0);
  el.innerHTML=esc(text.slice(0,n))+(blink?'<span class="caret"></span>':'');
}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
function vis(el,on){el.style.display=on?'block':'none'}

/* ---------- icons (generic glyphs, not product logos) ---------- */
const ICON={
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="#07070c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l2 2 3-3"/><path d="M12 7h8"/><path d="M4 13l2 2 3-3"/><path d="M12 14h8"/><path d="M12 20h8"/><circle cx="6.5" cy="20" r="1.4" fill="#07070c"/></svg>`,
  type:`<svg viewBox="0 0 24 24"><text x="12" y="18" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="17" fill="#07070c">Aa</text></svg>`,
  book:`<svg viewBox="0 0 24 24" fill="none" stroke="#07070c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5 3h11a3 3 0 013 3v15H8a3 3 0 01-3-3z"/><path d="M5 18a3 3 0 013-3h11"/><path d="M12 6.5l.9 1.8 1.8.9-1.8.9-.9 1.8-.9-1.8-1.8-.9 1.8-.9z" fill="#07070c"/></svg>`,
  slides:`<svg viewBox="0 0 24 24" fill="none" stroke="#07070c" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="7" width="14" height="11" rx="2"/><path d="M7 4h12a2 2 0 012 2v9"/><path d="M6 14l3-3 2 2 3-3"/></svg>`,
  banana:`<svg viewBox="0 0 24 24" fill="none" stroke="#07070c" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"><path d="M4 13c3 5 11 6 16-2-1 0-2-.5-2.5-1.5C15 14 9 14 6 10z" fill="#07070c" fill-opacity=".18"/><path d="M18 9.5l1-3.5"/></svg>`,
  doc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M9 13h8M9 17h8M9 9h3"/></svg>`,
  play:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
  lock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>`,
  refill:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v5h-5"/></svg>`,
  headphones:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="5" height="7" rx="2" fill="currentColor"/><rect x="16" y="14" width="5" height="7" rx="2" fill="currentColor"/></svg>`,
  chat:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
};
const TOOLS=[
  {n:'Goblin.tools',c:'#4ade80',i:'check'},
  {n:'Ideogram',c:'#a78bfa',i:'type'},
  {n:'Gemini Notebook',c:'#60a5fa',i:'book'},
  {n:'Gamma',c:'#f472b6',i:'slides'},
  {n:'Nano Banana',c:'#facc15',i:'banana'},
];
const icon=(k,size,c)=>`<div class="icon" style="width:${size}px;height:${size}px;background:${c}">${ICON[k]}</div>`;

/* ---------- scene timeline (from forced alignment of the voiceover) ---------- */
const SC=[
  {id:'intro',s:0,e:9.6,c:'#ff8a3d'},
  {id:'s1',s:9.6,e:26.7,c:TOOLS[0].c},
  {id:'s2',s:26.7,e:47.45,c:TOOLS[1].c},
  {id:'s3',s:47.45,e:69.7,c:TOOLS[2].c},
  {id:'s4',s:69.7,e:86.8,c:TOOLS[3].c},
  {id:'s5',s:86.8,e:105.85,c:TOOLS[4].c},
  {id:'outro',s:105.85,e:118,c:'#ff8a3d'},
];
const DUR=118;
const root=$('#scenes');
const S={}; // scene element refs
function scene(id,html){const el=h(`<div class="scene" id="${id}">${html}</div>`);root.appendChild(el);S[id]=el;return el}

/* left column for tool scenes */
function leftCol(i,sub,pills){
  return `<div class="left">
    <div class="num" data-k="num">0${i+1}</div>
    <div style="display:flex;align-items:center;gap:22px;margin-top:18px" data-k="name">${icon(TOOLS[i].i,78,TOOLS[i].c)}<div class="tname" style="margin:0">${TOOLS[i].n}</div></div>
    <div class="tsub" data-k="sub">${sub}</div>
    ${pills.map((p,j)=>`<div class="pill ${p.k||''}" data-k="p${j}" style="top:${400+j*84}px"><div class="d">${p.k==='bad'?'✕':p.k==='warn'?'!':'✓'}</div>${p.t}</div>`).join('')}
  </div>`;
}
function leftAnim(el,start,subT,pillTimes){
  const q=k=>$(`[data-k="${k}"]`,el);
  inn(q('num'),start+.15,{x:-60,y:0});
  inn(q('name'),start+.3,{x:-60,y:0});
  inn(q('sub'),subT,{y:20});
  pillTimes.forEach((t,j)=>inn(q('p'+j),t,{x:-40,y:0,s:.9}));
}

/* ================= INTRO ================= */
scene('intro',`
  <div class="a disp" id="i-h1" style="left:0;right:0;top:170px;text-align:center;font-size:150px;line-height:1">
    <span id="i-5" style="display:inline-block;color:var(--ac)">5</span> <span id="i-ai" style="display:inline-block">AI TOOLS</span>
  </div>
  <div class="a" id="i-free" style="left:0;right:0;top:350px;text-align:center"><span class="chip" style="height:62px;font-size:30px;padding:0 30px;border-color:var(--ac);color:var(--ac)">FREE TO START</span></div>
  <div class="a" id="i-never" style="left:0;right:0;top:350px;text-align:center;font:600 34px Inter;color:var(--mut)">most people have <span style="color:var(--fg)">never</span> used them</div>
  <div class="a" id="i-row" style="left:130px;top:470px;width:1660px;height:260px">
    ${TOOLS.map((t,j)=>`<div class="tcard" id="i-c${j}" style="left:${j*340}px"><div class="no">#${j+1}</div><div class="ic">${icon(t.i,104,t.c)}</div><div class="nm">${t.n}</div></div>`).join('')}
  </div>
  <div class="a" id="i-pdf" style="left:560px;top:790px;width:800px;height:150px;display:flex;align-items:center;justify-content:center;gap:40px">
    <div id="i-doc" style="display:flex;align-items:center;gap:16px;color:var(--fg)"><div style="width:74px;height:74px;color:#60a5fa">${ICON.doc}</div><div><div class="disp" style="font-size:40px">50-page PDF</div></div></div>
    <div id="i-arrow" class="disp" style="font-size:60px;color:var(--ac)">→</div>
    <div id="i-pod" style="display:flex;align-items:center;gap:16px"><div style="width:70px;height:70px;color:#60a5fa">${ICON.headphones}</div><div><div class="disp" style="font-size:40px">Podcast</div><div id="i-wave" style="display:flex;gap:5px;height:34px;align-items:center;margin-top:4px"></div></div></div>
  </div>
`);
const iWave=$('#i-wave');for(let j=0;j<22;j++)iWave.appendChild(h('<i style="display:block;width:6px;border-radius:3px;background:#60a5fa"></i>'));

function upIntro(){
  inn($('#i-5'),0.05,{s:.3,y:0,d:.6});
  inn($('#i-ai'),0.45,{y:60,d:.6});
  inn($('#i-free'),1.45,{s:.7,y:0,o:2.35,oy:-10});
  inn($('#i-never'),2.5,{y:20});
  const unblur=[3.0,3.6,4.55,8.0,8.55];
  TOOLS.forEach((t,j)=>{
    const c=$('#i-c'+j);
    inn(c,2.4+j*.09,{y:120,d:.7,e:E.back});
    const ub=pr(unblur[j],.45,E.out);
    const ic=$('.ic',c),nm=$('.nm',c);
    ic.style.filter=nm.style.filter=`blur(${(1-ub)*16}px)`;
    // focus on #3 while the PDF->podcast line plays
    const focus=pr(4.5,.5)*(1-pr(7.8,.5));
    if(j===2){c.style.transform+=` translateY(${-24*focus}px) scale(${1+.12*focus})`;c.style.borderColor=focus>.1?'#60a5fa':'';c.style.boxShadow=`0 0 ${70*focus}px rgba(96,165,250,${.45*focus})`;c.style.zIndex=5}
    else c.style.opacity=parseFloat(c.style.opacity)*(1-.6*focus);
    c.style.borderColor=(j!==2&&ub>.99&&T<unblur[j]+.6)?t.c:(j===2&&focus>.1?'#60a5fa':'');
  });
  inn($('#i-doc'),5.75,{x:-40,y:0,o:9.2});
  inn($('#i-arrow'),6.7,{x:-30,y:0,o:9.2});
  inn($('#i-pod'),7.25,{x:-30,y:0,o:9.2});
  $$('i',iWave).forEach((b,j)=>{const env=VO.env[Math.floor(T*30)]||0;b.style.height=(6+28*env*(.5+.5*Math.abs(Math.sin(j*1.7+T*9))))+'px'});
}

/* ================= #1 GOBLIN.TOOLS ================= */
const G_ITEMS=[['Pick a domain name','15 min'],['Choose a site builder','30 min'],['Write the homepage copy','45 min'],['Add photos & a logo','20 min'],['Set up a contact form','25 min'],['Hit publish','10 min']];
scene('s1',leftCol(0,'Turns overwhelming tasks into tiny steps',[{t:'Completely free'},{t:'Estimates time for each step'},{t:'Beats procrastination'}])+`
  <div class="card right" id="g-app">
    <div class="win-bar"><i></i><i></i><i></i><span>magic to-do</span></div>
    <div class="a" style="left:28px;right:28px;top:78px;height:84px;border-radius:18px;background:#0b0b12;border:1.5px solid var(--line);display:flex;align-items:center;padding:0 24px" id="g-input">
      <div id="g-text" style="font:600 32px Inter;flex:1;white-space:nowrap"></div>
      <div id="g-btn" class="chip" style="background:var(--ac);color:#07070c;border:0;height:52px;font-size:22px;padding:0 22px">Break it down ✦</div>
    </div>
    <div class="a" id="g-list" style="left:0;right:0;top:186px">
      ${G_ITEMS.map((it,j)=>`<div class="gi-row" id="g-r${j}" style="top:${j*64}px"><div class="cb"></div><span class="tx">${it[0]}</span><span class="tm">${it[1]}</span></div>`).join('')}
    </div>
    <div class="a" id="g-foot" style="left:28px;right:28px;top:600px">
      <div style="display:flex;justify-content:space-between;font:600 22px 'JetBrains Mono';color:var(--mut)"><span id="g-pct">0% done</span><span id="g-total">≈ 2h 25m total</span></div>
      <div style="margin-top:14px;height:16px;border-radius:8px;background:#20202f;overflow:hidden"><div id="g-bar" style="height:100%;width:0;background:var(--ac);border-radius:8px"></div></div>
    </div>
    <div class="a disp" id="g-stamp" style="left:520px;top:300px;padding:10px 26px;border:6px solid var(--ac);color:var(--ac);border-radius:18px;font-size:64px;transform:rotate(-10deg)">DONE ✓</div>

      w1.style.background=SC[i].c;w2.style.background='#0e0e16';
      const x1=lerp(-2700,2400,E.inOut(k)),x2=lerp(-2700,2400,E.inOut(clamp(k*1.12-.12)));
      w1.style.transform=`translateX(${x1}px) skewX(-14deg)`;w2.style.transform=`translateX(${x2-140}px) skewX(-14deg)`;
    }
  }
  if(!shown){w1.style.transform=w2.style.transform='translateX(-4000px)'}
  // end fade
  $('#stage').style.filter=t>117.3?`brightness(${1-clamp((t-117.3)/.7)})`:'';
}
window.seek=seek;window.DUR=DUR;

/* ---------- preview player ---------- */
const params=new URLSearchParams(location.search);
if(params.get('render')){document.body.classList.add('render');}
function fit(){if(document.body.classList.contains('render'))return;const s=Math.min(innerWidth/1920,(innerHeight-56)/1080);const st=$('#stage');st.style.transform=`scale(${s})`;st.style.left=((innerWidth-1920*s)/2)+'px'}
addEventListener('resize',fit);fit();
const au=$('#vo'),sc=$('#scrub'),tc=$('#tc');let playing=false,clock0=0,t0=0;
function now(){if(!playing)return parseFloat(sc.value);return au.duration&&!au.ended&&au.currentTime<au.duration-.05?au.currentTime:t0+(performance.now()-clock0)/1000}
function loop(){const t=now();if(t>=DUR){playing=false;$('#play').textContent='Play'}seek(Math.min(t,DUR-.001));if(playing)sc.value=t;tc.textContent=t.toFixed(2);requestAnimationFrame(loop)}
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'Pause':'Play';if(playing){t0=parseFloat(sc.value);if(t0>=DUR-.1)t0=0;au.currentTime=t0;clock0=performance.now();au.play().catch(()=>{})}else au.pause()};
sc.oninput=()=>{if(playing){au.currentTime=parseFloat(sc.value);t0=parseFloat(sc.value);clock0=performance.now()}};
$('#capt').onchange=e=>{showCaps=e.target.checked};
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();$('#play').click()}if(e.key==='c'){showCaps=!showCaps;$('#capt').checked=showCaps}});
if(params.get('t'))sc.value=params.get('t');
seek(parseFloat(sc.value));
if(!params.get('render'))requestAnimationFrame(loop);
</script>
