<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="data/timing.js"></script>
<script src="src/lib.js"></script><script src="src/footage.js"></script><script src="src/promo.js"></script>
<script src="src/core.js"></script><script src="src/scenes1.js"></script><script src="src/scenes2.js"></script><script src="src/scenes3.js"></script>
<script src="src/main.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
window.ready=Promise.all(['900 40px "Inter Display"','800 40px "Inter Display"','700 40px "Inter Display"','500 40px Inter','600 40px Inter','700 40px Inter','650 40px Inter'].map(f=>document.fonts.load(f)));
window.frameJPEG=t=>{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;drawFrame(ctx,t);return cv.toDataURL('image/jpeg',0.93).split(',')[1];};
</script></body></html>
