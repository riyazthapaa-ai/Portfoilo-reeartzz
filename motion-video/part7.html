<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WorkBuddy Cycle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07080f}
body{font-family:'Inter Display','Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:#07080f}
.glow{position:absolute;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%}
#grid{position:absolute;inset:-80px;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.8px);background-size:44px 44px}
#grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.65) 100%);pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.line{position:relative;font-weight:700;letter-spacing:-.035em;line-height:1.1;text-align:center;white-space:nowrap}
.line.abs{position:absolute}
.w{display:inline-block;margin-right:.24em;will-change:transform}
.w:last-child{margin-right:0}
.acc{background:linear-gradient(95deg,#a493ff 0%,#5fd8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.warm{background:linear-gradient(95deg,#ff8a7a 0%,#ffc857 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.center{left:0;right:0;display:flex;flex-direction:column;align-items:center}
.glass{background:linear-gradient(180deg,#1a1d31,#121426);border:1px solid rgba(255,255,255,.11);box-shadow:0 40px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.label{font-size:22px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.55)}
svg.i{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* s1 */
.mdoc{position:absolute;left:0;top:0;width:42px;height:54px;border-radius:7px;border:2px solid currentColor;
  background:linear-gradient(currentColor,currentColor) 8px 14px/22px 3px no-repeat,linear-gradient(currentColor,currentColor) 8px 23px/18px 3px no-repeat,linear-gradient(currentColor,currentColor) 8px 32px/22px 3px no-repeat,rgba(10,12,24,.8)}
.pill{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;font-size:26px;font-weight:700;color:rgba(255,255,255,.45);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}

/* s2 */
.card{position:absolute;left:0;top:0;width:440px;height:126px;margin:-63px 0 0 -220px;border-radius:24px;display:flex;align-items:center;gap:22px;padding:0 28px}
.ic{width:70px;height:70px;border-radius:19px;display:grid;place-items:center;flex:none}
.card b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em}
.card small{display:block;font-size:19px;color:rgba(255,255,255,.5);margin-top:4px;font-family:'Inter';font-weight:500}

/* s4 */
.search{position:absolute;left:470px;top:250px;width:980px;height:108px;border-radius:54px;display:flex;align-items:center;gap:22px;padding:0 40px;font-size:38px;font-weight:500;font-family:'Inter'}
.caret{display:inline-block;width:3px;height:42px;background:#5fd8ff;vertical-align:middle;margin-left:3px}
.drop{position:absolute;left:470px;top:378px;width:980px;height:96px;border-radius:28px;display:flex;align-items:center;gap:18px;padding:0 40px;font-size:28px;font-family:'Inter';color:rgba(255,255,255,.75)}

/* s5 */
.win{position:absolute;left:210px;top:110px;width:1500px;height:790px;border-radius:28px;overflow:hidden}
.bar{height:62px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.dot{width:16px;height:16px;border-radius:50%}
.path{margin-left:24px;font-family:'Inter';font-size:20px;color:rgba(255,255,255,.5)}
.content{position:absolute;left:0;top:62px;right:0;bottom:0}
.fold{position:absolute;width:150px;text-align:center;font-family:'Inter';font-size:18px;color:rgba(255,255,255,.7)}
.fold svg{width:110px;height:88px;display:block;margin:0 auto 6px}
.file{position:absolute;width:330px;height:96px;border-radius:22px;display:flex;align-items:center;gap:18px;padding:0 22px;font-family:'Inter';font-size:22px;font-weight:600}
.file .ic{width:58px;height:58px;border-radius:15px}
.file .tag{position:absolute;left:22px;top:-40px;font-size:17px;font-weight:500;color:rgba(255,255,255,.6);white-space:nowrap}
.ring{position:absolute;inset:-10px;border-radius:30px;border:3px solid}
.lower{position:absolute;left:0;right:0;top:940px;display:flex;justify-content:center}
.lower div{position:absolute;padding:20px 40px;border-radius:40px;font-size:38px;font-weight:600;letter-spacing:-.02em;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);white-space:nowrap}

/* s6 */
.chat{position:absolute;left:410px;top:270px;width:1100px;height:720px;border-radius:30px;overflow:hidden}
.chat .bar{font-size:24px;font-weight:600;gap:14px}
.msgs{position:absolute;left:0;right:0;top:62px;bottom:170px;padding:30px 36px;display:flex;flex-direction:column;justify-content:flex-end;gap:22px;overflow:hidden;font-family:'Inter'}
.bub{max-width:780px;padding:22px 28px;border-radius:26px;font-size:25px;line-height:1.45}
.bot{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:8px}
.me{align-self:flex-end;background:linear-gradient(135deg,#6d5cff,#3aa8ff);border-bottom-right-radius:8px}
.input{position:absolute;left:30px;right:30px;bottom:28px;height:84px;border-radius:42px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;padding:0 32px;font-family:'Inter';font-size:24px;color:rgba(255,255,255,.4)}
.chip{position:absolute;left:0;top:0;height:54px;padding:0 20px 0 12px;border-radius:16px;display:flex;align-items:center;gap:12px;font-family:'Inter';font-size:20px;font-weight:600;white-space:nowrap}
.chip .ic{width:34px;height:34px;border-radius:10px}
.chip svg.i{width:22px;height:22px}
.stamp{position:absolute;left:960px;top:610px;padding:18px 46px;border:10px solid #ff6b6b;border-radius:24px;color:#ff6b6b;font-size:140px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;background:rgba(7,8,15,.55)}

/* s7 */
.cal{position:absolute;left:560px;top:330px;width:360px;height:420px;border-radius:36px;overflow:hidden;perspective:900px}
.cal .top{height:96px;background:linear-gradient(135deg,#ff6b6b,#ff9a6b);display:grid;place-items:center;font-size:40px;font-weight:800;letter-spacing:.2em}
.num{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:190px;font-weight:800;letter-spacing:-.05em;line-height:1;backface-visibility:hidden}
.cal .lbl{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:26px;font-weight:700;letter-spacing:.3em;color:rgba(255,255,255,.6)}
.toast{position:absolute;left:1000px;width:560px;border-radius:26px;padding:24px 28px 24px 70px;font-family:'Inter'}
.toast i{position:absolute;left:30px;top:32px;width:18px;height:18px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 0 6px rgba(255,107,107,.2)}
.toast b{display:block;font-size:26px;margin-bottom:6px}
.toast span{font-size:21px;color:rgba(255,255,255,.6)}
.node{position:absolute;width:150px;margin-left:-75px;text-align:center;font-size:24px;font-weight:600}
.node .c{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.15)}
.node svg.i{width:40px;height:40px}
/* part 2 */
.wm{display:flex;align-items:center;gap:34px}
.logo{width:132px;height:132px;border-radius:36px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#3ab8ff);box-shadow:0 30px 80px rgba(110,90,255,.45),inset 0 2px 0 rgba(255,255,255,.3)}
.logo svg.i{width:72px;height:72px;stroke-width:1.6;fill:rgba(255,255,255,.25)}
.wmtext{font-size:156px;font-weight:800;letter-spacing:-.045em}
.burstring{position:absolute;left:960px;top:540px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:3px solid #8f7dff}
.minidoc{position:absolute;left:0;top:0;width:150px;height:62px;margin:-31px 0 0 -75px;border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 12px;font-family:Inter;font-size:16px;font-weight:600}
.minidoc .ic{width:38px;height:38px;border-radius:11px}
.minidoc svg.i{width:22px;height:22px}
.box{position:absolute;left:780px;top:520px;width:360px;height:250px}
.boxbody{position:absolute;left:0;right:0;top:40px;bottom:0;border-radius:0 0 26px 26px;background:linear-gradient(180deg,#2a2d40,#1b1d2c);border:1px solid rgba(255,255,255,.12)}
.boxlid{position:absolute;left:-14px;right:-14px;top:0;height:46px;border-radius:16px;background:#33364b;border:1px solid rgba(255,255,255,.14);transform-origin:left bottom}
.boxlbl{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:24px;font-weight:700;letter-spacing:.3em;color:rgba(255,255,255,.35)}
.tile{position:absolute;left:0;top:0;width:190px;height:140px;margin:-70px 0 0 -95px;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;font-family:Inter;font-size:18px;font-weight:600;text-align:center}
.tile .ic{width:58px;height:58px;border-radius:16px}
.orb{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9bfff,#7c5cff 45%,#2b6cff 100%);box-shadow:0 0 80px rgba(124,92,255,.7),0 0 0 14px rgba(124,92,255,.12);display:grid;place-items:center}
.orb svg.i{width:66px;height:66px;fill:rgba(255,255,255,.35);stroke-width:1.5}
.orblbl{position:absolute;width:240px;margin-left:-120px;text-align:center;font-size:26px;font-weight:700}
.pulse{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(143,125,255,.8)}
.app{position:absolute;left:250px;top:240px;width:1420px;height:720px;border-radius:30px;overflow:hidden}
.side{position:absolute;left:0;top:62px;bottom:0;width:270px;border-right:1px solid rgba(255,255,255,.08);padding:26px 18px;font-family:Inter;font-size:21px;font-weight:600}
.side div{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;color:rgba(255,255,255,.55);margin-bottom:6px}
.side div.on{background:rgba(143,125,255,.18);color:#fff}
.side svg.i{width:24px;height:24px}
.main{position:absolute;left:270px;right:0;top:62px;bottom:0;padding:34px 40px}
.mh{display:flex;align-items:baseline;gap:18px;font-size:40px;font-weight:700;letter-spacing:-.02em}
.mh span{font-family:Inter;font-size:20px;font-weight:500;color:rgba(255,255,255,.5)}
.res{position:absolute;width:256px;height:190px;border-radius:22px;padding:22px;font-family:Inter}
.res .ic{width:56px;height:56px;border-radius:15px;margin-bottom:18px}
.res b{display:block;font-size:21px;line-height:1.25}
.res small{display:block;font-size:16px;color:rgba(255,255,255,.45);margin-top:6px}
.res .ok{position:absolute;right:18px;top:18px;width:30px;height:30px;border-radius:50%;background:#2fd28f;display:grid;place-items:center}
.res .ok svg{width:18px;height:18px;stroke:#062;stroke-width:3;fill:none}
.addslot{position:absolute;width:256px;height:190px;border-radius:22px;border:2px dashed rgba(255,255,255,.18);display:grid;place-items:center;font-family:Inter;font-size:20px;color:rgba(255,255,255,.4)}
.chipc{position:absolute;left:0;top:0;height:62px;margin:-31px 0 0 0;padding:0 20px 0 12px;border-radius:18px;display:flex;align-items:center;gap:12px;font-family:Inter;font-size:19px;font-weight:600;white-space:nowrap;transform-origin:center}
.chipc .ic{width:38px;height:38px;border-radius:11px}
.chipc svg.i{width:22px;height:22px}
.dfold{position:absolute;left:810px;top:520px;width:300px}
.zz{position:absolute;font-size:44px;font-weight:800;color:rgba(255,255,255,.5)}
.dust{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.thought{position:absolute;left:460px;top:440px;width:1000px;height:230px;border-radius:115px;display:flex;align-items:center;justify-content:center;padding:0 70px;font-size:56px;font-weight:700;letter-spacing:-.02em;text-align:center}
.tdot{position:absolute;border-radius:50%}
.qm{position:absolute;font-size:64px;font-weight:800;color:#ffc857}
.ask{position:absolute;left:410px;top:470px;width:1100px;height:110px;border-radius:55px;display:flex;align-items:center;gap:22px;padding:0 20px 0 44px;font-family:Inter;font-size:34px;font-weight:500}
.send{margin-left:auto;width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#3ab8ff);display:grid;place-items:center}
.send svg{width:34px;height:34px;stroke:#fff;stroke-width:2.4;fill:none}

/* part 3 */
.day{width:220px;height:250px;border-radius:28px;display:flex;flex-direction:column;align-items:center;padding-top:26px;gap:14px}
.day b{font-size:30px;font-weight:800;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.day .q{width:150px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.18);display:grid;place-items:center;font-family:Inter;font-size:22px;font-weight:700;color:rgba(255,255,255,.35)}
.agentwin{position:absolute;left:210px;top:205px;width:1500px;height:790px;border-radius:30px;overflow:hidden}
.pbub{position:absolute;right:44px;top:100px;width:1160px;padding:34px 40px;border-radius:30px;border-bottom-right-radius:10px;background:linear-gradient(135deg,rgba(109,92,255,.9),rgba(58,168,255,.85));font-family:Inter;font-size:36px;font-weight:500;line-height:1.5}
.pw{display:inline-block;margin-right:.26em}
.pw.hl{font-weight:700;color:#fff;background:rgba(255,255,255,.18);border-radius:8px;padding:0 6px;margin-left:-6px;margin-right:.2em}
.pw.pa{text-decoration:underline;text-decoration-color:#ffd77a;text-decoration-thickness:4px;text-underline-offset:8px}
.sec{position:absolute;font-family:Inter;font-size:19px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.askp{position:absolute;height:72px;padding:0 26px 0 14px;border-radius:20px;display:flex;align-items:center;gap:14px;font-family:Inter;font-size:24px;font-weight:600;white-space:nowrap}
.askp i{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-weight:800;background:rgba(255,200,87,.18);color:#ffd77a;border:1px solid rgba(255,200,87,.45)}
.instr{position:absolute;width:440px;height:150px;border-radius:26px;display:flex;align-items:center;gap:22px;padding:0 30px;font-size:36px;font-weight:700;letter-spacing:-.02em}
.instr .ic{width:74px;height:74px;border-radius:20px}
.instr svg.i{width:40px;height:40px}
.xline{position:absolute;left:20px;right:20px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:#ff6b6b;transform-origin:left center}
.taskcard{position:absolute;left:560px;top:430px;width:800px;height:200px;border-radius:34px;display:flex;align-items:center;gap:30px;padding:0 44px}
.taskcard .logo{width:110px;height:110px;border-radius:30px;flex:none}
.taskcard .logo svg.i{width:58px;height:58px}
.taskcard b{display:block;font-size:52px;font-weight:800;letter-spacing:-.03em}
.taskcard small{display:block;font-family:Inter;font-size:22px;color:rgba(255,255,255,.55);margin-top:6px}
.beam{position:absolute;width:12px;border-radius:6px;background:linear-gradient(180deg,transparent,#8f7dff,transparent);box-shadow:0 0 40px #8f7dff}
.status{position:absolute;width:420px;margin-left:-210px;text-align:center;font-family:Inter;font-size:22px;font-weight:600;padding:12px 0;border-radius:30px}
.result{position:absolute;left:260px;top:250px;width:1400px;height:620px;border-radius:32px;padding:40px 48px;font-family:Inter}
.result h3{font-family:'Inter Display';font-size:44px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:18px}
.result h3 span{font-family:Inter;font-size:20px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.04em}
.col{position:absolute;top:140px;width:410px}
.col .sec{position:static;margin-bottom:18px;display:block}
.it{padding:18px 20px;border-radius:18px;margin-bottom:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);font-size:22px;font-weight:600;line-height:1.35}
.it small{display:block;font-size:17px;font-weight:500;color:rgba(255,255,255,.5);margin-top:4px}
.it.warn{border-color:rgba(255,200,87,.45);background:rgba(255,200,87,.08)}
.it.top{border-color:rgba(124,92,255,.7);background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(58,168,255,.18));font-size:28px;padding:28px 24px}
.badge{position:absolute;padding:14px 28px;border-radius:40px;font-family:Inter;font-size:24px;font-weight:700;background:rgba(47,210,143,.15);border:1px solid rgba(47,210,143,.55);color:#7ef0c0;white-space:nowrap}
.loopic{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px}
.loopic svg{width:120px;height:120px;fill:none;stroke:#8f7dff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div id="stage">
  <div id="bg">
    <div class="glow" id="g1"></div><div class="glow" id="g2"></div><div class="glow" id="g3"></div>
    <div id="grid"></div>
  </div>
    <canvas id="grain" width="1920" height="1080"></canvas>
  <div id="vig"></div>
  <div id="fade"></div>
</div>

<script>
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,s,d)=>clamp((t-s)/d);
const eo=x=>1-Math.pow(1-x,3);
const eo5=x=>1-Math.pow(1-x,5);
const ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const $=id=>document.getElementById(id);
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const blur=v=>v>.05?`blur(${v.toFixed(2)}px)`:'none';
const ICON={
 doc:'<path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5M9 12h7M9 15.5h7M9 19h4"/>',
 film:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 9l1.5-5 16.5 0L19.5 9M8.5 4L7 9M13.5 4L12 9M18 4l-1.5 5"/>',
 note:'<path d="M5 3h14v12l-6 6H5z"/><path d="M13 21v-6h6M8 8h8M8 11.5h5"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
 chart:'<path d="M4 4v16h16M8.5 16v-4M12.5 16V8M16.5 16v-6"/>',
 sheet:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 redo:'<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/>',
};
const svg=(k,style='')=>`<svg class="i" viewBox="0 0 24 24" style="${style}">${ICON[k]}</svg>`;

function build(el,text){
  el.querySelectorAll('.w').forEach(n=>n.remove());
  let acc=null;
  text.split(' ').forEach(tok=>{
    let cls=acc;
    const m=tok.match(/^([\[{])/);
    if(m){acc=m[1]=='['?'acc':'warm';cls=acc;tok=tok.slice(1)}
    const k=tok.search(/[\]}]/);
    if(k>=0){tok=tok.slice(0,k)+tok.slice(k+1);acc=null}
    const s=document.createElement('span');s.className='w'+(cls?' '+cls:'');s.textContent=tok;el.appendChild(s);
  });
}
function kin(el,lt,inAt,outAt=1e9,st=.07){
