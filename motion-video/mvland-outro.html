<body>

<div id="stage">
  <div id="bg">
    <div class="glow" id="g1"></div><div class="glow" id="g2"></div><div class="glow" id="g3"></div>
    <div id="grid"></div>
  </div>
    <canvas id="grain" width="1920" height="1080"></canvas>
  <div id="vig"></div>
  <div id="fade"></div>
</div>

<script>
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,s,d)=>clamp((t-s)/d);
const eo=x=>1-Math.pow(1-x,3);
const eo5=x=>1-Math.pow(1-x,5);
const ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const $=id=>document.getElementById(id);
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const blur=v=>v>.05?`blur(${v.toFixed(2)}px)`:'none';
const ICON={
 doc:'<path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5M9 12h7M9 15.5h7M9 19h4"/>',
 film:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 9l1.5-5 16.5 0L19.5 9M8.5 4L7 9M13.5 4L12 9M18 4l-1.5 5"/>',
 note:'<path d="M5 3h14v12l-6 6H5z"/><path d="M13 21v-6h6M8 8h8M8 11.5h5"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
 chart:'<path d="M4 4v16h16M8.5 16v-4M12.5 16V8M16.5 16v-6"/>',
 sheet:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 redo:'<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/>',
};
const svg=(k,style='')=>`<svg class="i" viewBox="0 0 24 24" style="${style}">${ICON[k]}</svg>`;

function build(el,text){
  el.querySelectorAll('.w').forEach(n=>n.remove());
  let acc=null;
  text.split(' ').forEach(tok=>{
    let cls=acc;
    const m=tok.match(/^([\[{])/);
    if(m){acc=m[1]=='['?'acc':'warm';cls=acc;tok=tok.slice(1)}
    const k=tok.search(/[\]}]/);
    if(k>=0){tok=tok.slice(0,k)+tok.slice(k+1);acc=null}
    const s=document.createElement('span');s.className='w'+(cls?' '+cls:'');s.textContent=tok;el.appendChild(s);
  });
}
function kin(el,lt,inAt,outAt=1e9,st=.07){

  enter($('m3m'),T,musT-.1,{y:70,s:.85});enter($('m3s'),T,stoT-.1,{y:70,s:.85});
  animWave('m3w',T,1.1);[0,1,2].forEach(i=>enter($('m3b'+i),T,stoT+.3+i*.25,{y:20,s:.5}));
});
cue(musT,'pop');cue(stoT,'pop');[0,1,2].forEach(i=>cue(stoT+.4+i*.25,'tick'));
// ---- 4: build the visuals around that
const visT=at('visuals',25.3);
const TH=['Opening shot','Chorus','Close-up','Dance break','Bridge','Finale'];
scene('m4',24.2,27.2,HL(140,[['m4a','Then build the [visuals] around that.',84,'font-weight:800']])+
  `<div class="core" id="m4c">${wave(10,'m4w')}<span><span class="mag">Music</span> + Story</span></div>`+
  TH.map((t,i)=>`<div class="thumb" id="m4t${i}" style="background:${GR[i]}"><span>${t}</span></div>`).join(''),(lt,T)=>{
  kin($('m4a'),T,24.4,1e9,.06);
  enter($('m4c'),T,24.4,{s:.5,y:0});animWave('m4w',T,.6);
  TH.forEach((t,i)=>{const el=$('m4t'+i),k=back(p(T,visT+i*.1,.55)),a=(-90+i*60)*Math.PI/180+T*.15;
    el.style.opacity=clamp(p(T,visT+i*.1,.2));el.style.transform=`translate(${960+Math.cos(a)*lerp(150,380,k)}px,${640+Math.sin(a)*lerp(100,250,k)}px) scale(${lerp(.4,1,k)})`});
});
TH.forEach((t,i)=>cue(visT+i*.1+.2,'tick'));
// ---- 5: music -> storytelling -> characters -> shots -> final cut -> music video
const PIPE=[['Music','note','#ff6fb1','music',28.4],['Storytelling','book','#ffc857','storytelling',29],['Characters','user','#6ee7b7','characters',30.3],['Shots','cam','#5fd8ff','shots',31.9],['Final cut','film','#a493ff','final',32.9]];
const piT=PIPE.map(s=>at(s[3],s[4])),mvl2=at('mvland',33.8),vidT=at('video',38.4);
scene('m5',27.2,42.6,HL(130,[['m5a','From the [music & storytelling] to the {final cut}…',72],['m5b','MVLAND turns your creative idea into a [music video.]',66]])+
  `<svg id="m5sv" class="abs" width="1920" height="1080" style="left:0;top:0"></svg>`+PIPE.map((s,i)=>`<div class="stp glass" id="m5s${i}"><span class="k">0${i+1}</span>${icx(s[1],s[2])}${s[0]}</div>`).join('')+
  `<div class="player glass" id="m5p" style="top:290px"><div class="pbtn" id="m5pb2">${PLAY}</div>${TH.map((t,i)=>`<div id="m5f${i}" style="position:absolute;inset:0;background:${GR[i]};opacity:0"></div>`).join('')}<div class="bar2"><div id="m5pb"></div></div></div>`+
  `<div class="abs center" style="top:800px" id="m5end"><div style="transform:scale(.55)">${logoHTML('m5lg')}</div></div>`,(lt,T)=>{
  kin($('m5a'),T,27.4,mvl2-.25,.06);kin($('m5b'),T,mvl2,1e9,.05);
  const col=eio(p(T,mvl2+.1,.7));
  PIPE.forEach((s,i)=>{const el=$('m5s'+i),k=back(p(T,piT[i]-.05,.55));const x=lerp(240+i*360,960,col),y=lerp(560,560,col);
    el.style.opacity=clamp(p(T,piT[i]-.05,.2))*(1-col);el.style.transform=`translate(${x}px,${y}px) scale(${lerp(.5,1,k)*lerp(1,.5,col)})`;
    const on=T>piT[i]&&T<(piT[i+1]||mvl2);el.style.borderColor=on?s[2]+'aa':'';el.style.boxShadow=on?`0 0 40px ${s[2]}44`:'';
    if(i<4){const l=M5L[i],k2=eio(p(T,piT[i+1]-.2,.3));l.setAttribute('x1',240+i*360+125);l.setAttribute('y1',560);l.setAttribute('x2',lerp(240+i*360+125,240+(i+1)*360-125,k2));l.setAttribute('y2',560);l.style.opacity=k2*.6*(1-col)}});
  const pk=back(p(T,mvl2+.5,.6));$('m5p').style.opacity=clamp(pk*2);$('m5p').style.transform=`scale(${lerp(.5,1,pk)})`;
  const play=clamp((T-mvl2-1.1)/(vidT-mvl2-.6));$('m5pb').style.width=(100*play)+'%';$('m5pb2').style.opacity=play>0?1-p(T,mvl2+1.1,.3):1;
  TH.forEach((t,i)=>{const seg=play*6;$('m5f'+i).style.opacity=play>0?(i==5&&seg>5.5?1:clamp(1-Math.abs(seg-i-.5)*1.4)):0});
  const e=back(p(T,vidT+.2,.6));$('m5end').style.opacity=clamp(e*2);$('m5end').style.transform=`translateY(${(1-e)*40}px)`;
});
const M5L=[0,1,2,3].map(()=>mkline($('m5sv'),'#ff6fb1'));
piT.forEach(t=>cue(t+.08,'pop'));cue(mvl2+.5,'ding');cue(vidT+.3,'shimmer');
FADE=t=>eio(p(t,41.2,1.4));

const DURATION=42.6;
// ---------- background / grain ----------
const gctx=$('grain').getContext('2d');const noise=[];
for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d');const im=x.createImageData(480,270);
  for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);noise.push(c)}
const stress=t=>STRESS(t+VO0);
function bg(t){
  const g1=$('g1'),g2=$('g2'),g3=$('g3');
  g1.style.background='radial-gradient(circle,rgba(124,92,255,.32),transparent 60%)';
  g2.style.background='radial-gradient(circle,rgba(34,211,238,.20),transparent 60%)';
  g3.style.background='radial-gradient(circle,rgba(255,107,107,.30),transparent 60%)';
  g1.style.transform=`translate(${560+Math.sin(t*.21)*220}px,${300+Math.cos(t*.17)*160}px)`;
  g2.style.transform=`translate(${1420+Math.cos(t*.19)*200}px,${800+Math.sin(t*.23)*140}px)`;
  g3.style.transform=`translate(${960+Math.sin(t*.3)*300}px,${540+Math.cos(t*.25)*120}px)`;g3.style.opacity=stress(t);
  $('grid').style.transform=`translate(${(t*6)%44}px,${(t*3)%44}px)`;
  gctx.imageSmoothingEnabled=false;gctx.drawImage(noise[Math.floor(t*24)%6],0,0,1920,1080);
}

// ---------- master render ----------

function render(t){
  bg(t);
  S.forEach((s,i)=>{
    const el=$(s.id);
    if(t<s.a-.01||t>s.b+.01){el.style.opacity=0;el.style.visibility='hidden';return}
    el.style.visibility='visible';
    const lt=t-s.a,last=i==S.length-1;
    const inn=i==0?eo(p(t,0,.6)):eo(p(t,s.a,.55));
    const out=last?0:ei(p(t,s.b-.45,.45));
    el.style.opacity=(inn*(1-out)).toFixed(3);
    el.style.transform=`scale(${(lerp(1.06,1,inn)*lerp(1,.94,out)*(1+lt*.0035)).toFixed(4)})`;
    el.style.filter=blur((1-inn)*14+out*14);
    FN[s.id](lt,t+VO0);
  });
  $('fade').style.opacity=FADE(t+VO0);
}
window.render=render;window.DURATION=DURATION;window.CUES=CUES.sort((a,b)=>a[0]-b[0]);
// preview mode: open the file directly in a browser to watch it play
if(!location.search.includes('capture')){
  document.fonts.ready.then(()=>{const t0=performance.now();const loop=()=>{render(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop)};loop()});
}
</script>
</body>
</html>
