<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WorkBuddy Library</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07080f}
body{font-family:'Inter Display','Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:#07080f}
.glow{position:absolute;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%}
#grid{position:absolute;inset:-80px;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.8px);background-size:44px 44px}
#grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.65) 100%);pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.line{position:relative;font-weight:700;letter-spacing:-.035em;line-height:1.1;text-align:center;white-space:nowrap}
.line.abs{position:absolute}
.w{display:inline-block;margin-right:.24em;will-change:transform}
.w:last-child{margin-right:0}
.acc{background:linear-gradient(95deg,#a493ff 0%,#5fd8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.warm{background:linear-gradient(95deg,#ff8a7a 0%,#ffc857 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.center{left:0;right:0;display:flex;flex-direction:column;align-items:center}
.glass{background:linear-gradient(180deg,#1a1d31,#121426);border:1px solid rgba(255,255,255,.11);box-shadow:0 40px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.label{font-size:22px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.55)}
svg.i{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* s1 */
.mdoc{position:absolute;left:0;top:0;width:42px;height:54px;border-radius:7px;border:2px solid currentColor;
  background:linear-gradient(currentColor,currentColor) 8px 14px/22px 3px no-repeat,linear-gradient(currentColor,currentColor) 8px 23px/18px 3px no-repeat,linear-gradient(currentColor,currentColor) 8px 32px/22px 3px no-repeat,rgba(10,12,24,.8)}
.pill{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;font-size:26px;font-weight:700;color:rgba(255,255,255,.45);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}

/* s2 */
.card{position:absolute;left:0;top:0;width:440px;height:126px;margin:-63px 0 0 -220px;border-radius:24px;display:flex;align-items:center;gap:22px;padding:0 28px}
.ic{width:70px;height:70px;border-radius:19px;display:grid;place-items:center;flex:none}
.card b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em}
.card small{display:block;font-size:19px;color:rgba(255,255,255,.5);margin-top:4px;font-family:'Inter';font-weight:500}

/* s4 */
.search{position:absolute;left:470px;top:250px;width:980px;height:108px;border-radius:54px;display:flex;align-items:center;gap:22px;padding:0 40px;font-size:38px;font-weight:500;font-family:'Inter'}
.caret{display:inline-block;width:3px;height:42px;background:#5fd8ff;vertical-align:middle;margin-left:3px}
.drop{position:absolute;left:470px;top:378px;width:980px;height:96px;border-radius:28px;display:flex;align-items:center;gap:18px;padding:0 40px;font-size:28px;font-family:'Inter';color:rgba(255,255,255,.75)}

/* s5 */
.win{position:absolute;left:210px;top:110px;width:1500px;height:790px;border-radius:28px;overflow:hidden}
.bar{height:62px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.dot{width:16px;height:16px;border-radius:50%}
.path{margin-left:24px;font-family:'Inter';font-size:20px;color:rgba(255,255,255,.5)}
.content{position:absolute;left:0;top:62px;right:0;bottom:0}
.fold{position:absolute;width:150px;text-align:center;font-family:'Inter';font-size:18px;color:rgba(255,255,255,.7)}
.fold svg{width:110px;height:88px;display:block;margin:0 auto 6px}
.file{position:absolute;width:330px;height:96px;border-radius:22px;display:flex;align-items:center;gap:18px;padding:0 22px;font-family:'Inter';font-size:22px;font-weight:600}
.file .ic{width:58px;height:58px;border-radius:15px}
.file .tag{position:absolute;left:22px;top:-40px;font-size:17px;font-weight:500;color:rgba(255,255,255,.6);white-space:nowrap}
.ring{position:absolute;inset:-10px;border-radius:30px;border:3px solid}
.lower{position:absolute;left:0;right:0;top:940px;display:flex;justify-content:center}
.lower div{position:absolute;padding:20px 40px;border-radius:40px;font-size:38px;font-weight:600;letter-spacing:-.02em;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);white-space:nowrap}

/* s6 */
.chat{position:absolute;left:410px;top:270px;width:1100px;height:720px;border-radius:30px;overflow:hidden}
.chat .bar{font-size:24px;font-weight:600;gap:14px}
.msgs{position:absolute;left:0;right:0;top:62px;bottom:170px;padding:30px 36px;display:flex;flex-direction:column;justify-content:flex-end;gap:22px;overflow:hidden;font-family:'Inter'}
.bub{max-width:780px;padding:22px 28px;border-radius:26px;font-size:25px;line-height:1.45}
.bot{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:8px}
.me{align-self:flex-end;background:linear-gradient(135deg,#6d5cff,#3aa8ff);border-bottom-right-radius:8px}
.input{position:absolute;left:30px;right:30px;bottom:28px;height:84px;border-radius:42px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;padding:0 32px;font-family:'Inter';font-size:24px;color:rgba(255,255,255,.4)}
.chip{position:absolute;left:0;top:0;height:54px;padding:0 20px 0 12px;border-radius:16px;display:flex;align-items:center;gap:12px;font-family:'Inter';font-size:20px;font-weight:600;white-space:nowrap}
.chip .ic{width:34px;height:34px;border-radius:10px}
.chip svg.i{width:22px;height:22px}
.stamp{position:absolute;left:960px;top:610px;padding:18px 46px;border:10px solid #ff6b6b;border-radius:24px;color:#ff6b6b;font-size:140px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;background:rgba(7,8,15,.55)}

/* s7 */
.cal{position:absolute;left:560px;top:330px;width:360px;height:420px;border-radius:36px;overflow:hidden;perspective:900px}
.cal .top{height:96px;background:linear-gradient(135deg,#ff6b6b,#ff9a6b);display:grid;place-items:center;font-size:40px;font-weight:800;letter-spacing:.2em}
.num{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:190px;font-weight:800;letter-spacing:-.05em;line-height:1;backface-visibility:hidden}
.cal .lbl{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:26px;font-weight:700;letter-spacing:.3em;color:rgba(255,255,255,.6)}
.toast{position:absolute;left:1000px;width:560px;border-radius:26px;padding:24px 28px 24px 70px;font-family:'Inter'}
.toast i{position:absolute;left:30px;top:32px;width:18px;height:18px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 0 6px rgba(255,107,107,.2)}
.toast b{display:block;font-size:26px;margin-bottom:6px}
.toast span{font-size:21px;color:rgba(255,255,255,.6)}
.node{position:absolute;width:150px;margin-left:-75px;text-align:center;font-size:24px;font-weight:600}
.node .c{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.15)}
.node svg.i{width:40px;height:40px}
/* part 2 */
.wm{display:flex;align-items:center;gap:34px}
.logo{width:132px;height:132px;border-radius:36px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#3ab8ff);box-shadow:0 30px 80px rgba(110,90,255,.45),inset 0 2px 0 rgba(255,255,255,.3)}
.logo svg.i{width:72px;height:72px;stroke-width:1.6;fill:rgba(255,255,255,.25)}
.wmtext{font-size:156px;font-weight:800;letter-spacing:-.045em}
.burstring{position:absolute;left:960px;top:540px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:3px solid #8f7dff}
.minidoc{position:absolute;left:0;top:0;width:150px;height:62px;margin:-31px 0 0 -75px;border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 12px;font-family:Inter;font-size:16px;font-weight:600}
.minidoc .ic{width:38px;height:38px;border-radius:11px}
.minidoc svg.i{width:22px;height:22px}
.box{position:absolute;left:780px;top:520px;width:360px;height:250px}
.boxbody{position:absolute;left:0;right:0;top:40px;bottom:0;border-radius:0 0 26px 26px;background:linear-gradient(180deg,#2a2d40,#1b1d2c);border:1px solid rgba(255,255,255,.12)}
.boxlid{position:absolute;left:-14px;right:-14px;top:0;height:46px;border-radius:16px;background:#33364b;border:1px solid rgba(255,255,255,.14);transform-origin:left bottom}
.boxlbl{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:24px;font-weight:700;letter-spacing:.3em;color:rgba(255,255,255,.35)}
.tile{position:absolute;left:0;top:0;width:190px;height:140px;margin:-70px 0 0 -95px;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;font-family:Inter;font-size:18px;font-weight:600;text-align:center}
.tile .ic{width:58px;height:58px;border-radius:16px}
.orb{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9bfff,#7c5cff 45%,#2b6cff 100%);box-shadow:0 0 80px rgba(124,92,255,.7),0 0 0 14px rgba(124,92,255,.12);display:grid;place-items:center}
.orb svg.i{width:66px;height:66px;fill:rgba(255,255,255,.35);stroke-width:1.5}
.orblbl{position:absolute;width:240px;margin-left:-120px;text-align:center;font-size:26px;font-weight:700}
.pulse{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(143,125,255,.8)}
.app{position:absolute;left:250px;top:240px;width:1420px;height:720px;border-radius:30px;overflow:hidden}
.side{position:absolute;left:0;top:62px;bottom:0;width:270px;border-right:1px solid rgba(255,255,255,.08);padding:26px 18px;font-family:Inter;font-size:21px;font-weight:600}
.side div{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;color:rgba(255,255,255,.55);margin-bottom:6px}
.side div.on{background:rgba(143,125,255,.18);color:#fff}
.side svg.i{width:24px;height:24px}
.main{position:absolute;left:270px;right:0;top:62px;bottom:0;padding:34px 40px}
.mh{display:flex;align-items:baseline;gap:18px;font-size:40px;font-weight:700;letter-spacing:-.02em}
.mh span{font-family:Inter;font-size:20px;font-weight:500;color:rgba(255,255,255,.5)}
.res{position:absolute;width:256px;height:190px;border-radius:22px;padding:22px;font-family:Inter}
.res .ic{width:56px;height:56px;border-radius:15px;margin-bottom:18px}
.res b{display:block;font-size:21px;line-height:1.25}
.res small{display:block;font-size:16px;color:rgba(255,255,255,.45);margin-top:6px}
.res .ok{position:absolute;right:18px;top:18px;width:30px;height:30px;border-radius:50%;background:#2fd28f;display:grid;place-items:center}
.res .ok svg{width:18px;height:18px;stroke:#062;stroke-width:3;fill:none}
.addslot{position:absolute;width:256px;height:190px;border-radius:22px;border:2px dashed rgba(255,255,255,.18);display:grid;place-items:center;font-family:Inter;font-size:20px;color:rgba(255,255,255,.4)}
.chipc{position:absolute;left:0;top:0;height:62px;margin:-31px 0 0 0;padding:0 20px 0 12px;border-radius:18px;display:flex;align-items:center;gap:12px;font-family:Inter;font-size:19px;font-weight:600;white-space:nowrap;transform-origin:center}
.chipc .ic{width:38px;height:38px;border-radius:11px}
.chipc svg.i{width:22px;height:22px}
.dfold{position:absolute;left:810px;top:520px;width:300px}
.zz{position:absolute;font-size:44px;font-weight:800;color:rgba(255,255,255,.5)}
.dust{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.thought{position:absolute;left:460px;top:440px;width:1000px;height:230px;border-radius:115px;display:flex;align-items:center;justify-content:center;padding:0 70px;font-size:56px;font-weight:700;letter-spacing:-.02em;text-align:center}
.tdot{position:absolute;border-radius:50%}
.qm{position:absolute;font-size:64px;font-weight:800;color:#ffc857}
.ask{position:absolute;left:410px;top:470px;width:1100px;height:110px;border-radius:55px;display:flex;align-items:center;gap:22px;padding:0 20px 0 44px;font-family:Inter;font-size:34px;font-weight:500}
.send{margin-left:auto;width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#3ab8ff);display:grid;place-items:center}
.send svg{width:34px;height:34px;stroke:#fff;stroke-width:2.4;fill:none}

</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <div class="glow" id="g1"></div><div class="glow" id="g2"></div><div class="glow" id="g3"></div>
    <div id="grid"></div>
  </div>
  <!-- A: WorkBuddy reveal -->
  <div class="scene" id="sA">
    <div class="burstring" id="ring1"></div><div class="burstring" id="ring2"></div>
    <div class="abs center" style="top:330px"><div class="line" id="aA" style="font-size:62px;font-weight:600;color:rgba(255,255,255,.85)"></div></div>
    <div class="abs center" style="top:450px"><div class="wm" id="wm"><div class="logo" id="logo"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2 5.5 5.5 2-5.5 2L12 18l-2-5.5-5.5-2 5.5-2z"/></svg></div><div class="wmtext" id="wmt">Work<span class="acc">Buddy</span></div></div></div>
  </div>
  <!-- B: store -> library -> agent -->
  <div class="scene" id="sB">
    <div class="abs center" style="top:120px">
      <div class="line abs" id="bA" style="font-size:72px"></div>
      <div class="line abs" id="bB" style="font-size:72px"></div>
      <div class="line abs" id="bC" style="font-size:72px"></div>
    </div>
    <div class="box" id="box"><div class="boxbody"><div class="boxlbl">STORAGE</div></div><div class="boxlid" id="lid"></div></div>
    <div id="bdocs"></div>
    <svg id="blinks" class="abs" width="1920" height="1080" style="left:0;top:0"></svg>
    <div id="btiles"></div>
    <div class="pulse" id="bp1"></div><div class="pulse" id="bp2"></div>
    <div class="orb" id="borb"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2 5.5 5.5 2-5.5 2L12 18l-2-5.5-5.5-2 5.5-2z"/></svg></div>
    <div class="orblbl" id="borbl">AI Agent</div>
  </div>
  <!-- C: building the library -->
  <div class="scene" id="sC">
    <div class="abs center" style="top:110px"><div class="line" id="cA" style="font-size:64px"></div></div>
    <div class="app glass" id="app">
      <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span style="margin-left:22px;font-size:22px;font-weight:700">Work<span class="acc">Buddy</span></span></div>
      <div class="side" id="side"></div>
      <div class="main"><div class="mh">Library <span id="count">0 resources</span></div><div id="resgrid" style="position:absolute;left:40px;top:110px"></div></div>
    </div>
  </div>
  <!-- D: not another folder -> context -->
  <div class="scene" id="sD">
    <div class="abs center" style="top:430px"><div class="line abs" id="dA" style="font-size:112px;font-weight:800"></div></div>
    <div class="abs center" style="top:190px">
      <div class="line" id="dB" style="font-size:76px"></div>
      <div class="line" id="dC" style="font-size:76px;color:rgba(255,255,255,.8);margin-top:8px"></div>
    </div>
    <div class="dfold" id="dfold"><svg viewBox="0 0 100 80" style="width:300px;height:240px"><path d="M6 10a5 5 0 0 1 5-5h22l8 8h48a5 5 0 0 1 5 5v52a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5z" fill="#4a4e66"/><path d="M6 24a5 5 0 0 1 5-5h78a5 5 0 0 1 5 5v46a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5z" fill="#5d6280"/></svg>
      <div style="text-align:center;font-family:Inter;font-size:22px;color:rgba(255,255,255,.45);margin-top:6px">Last opened: 8 months ago</div></div>
    <div id="zzs"></div><div id="dusts"></div>
    <div class="abs center" style="top:150px"><div class="line abs" id="dD" style="font-size:72px"></div></div>
    <svg id="dlinks" class="abs" width="1920" height="1080" style="left:0;top:0"></svg>
    <div id="dchips"></div>
    <div class="pulse" id="dp1"></div><div class="pulse" id="dp2"></div>
    <div class="orb" id="dorb"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2 5.5 5.5 2-5.5 2L12 18l-2-5.5-5.5-2 5.5-2z"/></svg></div>
    <div class="orblbl" id="dlbl" style="font-size:22px;padding:10px 0;border-radius:30px;background:rgba(47,210,143,.15);border:1px solid rgba(47,210,143,.5);color:#7ef0c0">Context loaded</div>
  </div>
  <!-- E: which files? -> just tell it -->
  <div class="scene" id="sE">
    <div class="abs center" style="top:150px">
      <div class="line abs" id="eA" style="font-size:72px;font-weight:600;color:rgba(255,255,255,.88)"></div>
      <div class="line abs" id="eB" style="font-size:76px"></div>
    </div>
    <div id="eorbit"></div>
    <div class="tdot glass" id="td1" style="left:640px;top:700px;width:48px;height:48px"></div>
    <div class="tdot glass" id="td2" style="left:590px;top:770px;width:28px;height:28px"></div>
    <div class="thought glass" id="thought"><div class="line" id="eQ" style="font-size:54px;white-space:normal"></div></div>
    <div class="ask glass" id="ask"><svg class="i" viewBox="0 0 24 24" style="stroke:#a493ff;fill:rgba(164,147,255,.25)"><path d="M12 3l2 5.5 5.5 2-5.5 2L12 18l-2-5.5-5.5-2 5.5-2z"/></svg><span id="askt"></span><span class="caret" id="askc"></span><div class="send" id="send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>
    <div id="echips" class="abs" style="left:0;right:0;top:720px;display:flex;justify-content:center;gap:16px"></div>
  </div>

  <canvas id="grain" width="1920" height="1080"></canvas>
  <div id="vig"></div>
  <div id="fade"></div>
</div>

<script>
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,s,d)=>clamp((t-s)/d);
const eo=x=>1-Math.pow(1-x,3);
const eo5=x=>1-Math.pow(1-x,5);
const ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const $=id=>document.getElementById(id);
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const blur=v=>v>.05?`blur(${v.toFixed(2)}px)`:'none';
const ICON={
 doc:'<path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5M9 12h7M9 15.5h7M9 19h4"/>',
 film:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 9l1.5-5 16.5 0L19.5 9M8.5 4L7 9M13.5 4L12 9M18 4l-1.5 5"/>',
 note:'<path d="M5 3h14v12l-6 6H5z"/><path d="M13 21v-6h6M8 8h8M8 11.5h5"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
 chart:'<path d="M4 4v16h16M8.5 16v-4M12.5 16V8M16.5 16v-6"/>',
 sheet:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 redo:'<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/>',
};
const svg=(k,style='')=>`<svg class="i" viewBox="0 0 24 24" style="${style}">${ICON[k]}</svg>`;

function build(el,text){
  el.querySelectorAll('.w').forEach(n=>n.remove());
  let acc=null;
  text.split(' ').forEach(tok=>{
    let cls=acc;
    const m=tok.match(/^([\[{])/);
    if(m){acc=m[1]=='['?'acc':'warm';cls=acc;tok=tok.slice(1)}
    const k=tok.search(/[\]}]/);
    if(k>=0){tok=tok.slice(0,k)+tok.slice(k+1);acc=null}
    const s=document.createElement('span');s.className='w'+(cls?' '+cls:'');s.textContent=tok;el.appendChild(s);
  });
}
function kin(el,lt,inAt,outAt=1e9,st=.07){
  const ws=el.querySelectorAll('.w');
  ws.forEach((w,i)=>{
    const a=eo(p(lt,inAt+i*st,.65)),b=eio(p(lt,outAt+i*.03,.4));
    w.style.opacity=(a*(1-b)).toFixed(3);
    w.style.transform=`translateY(${((1-a)*55-b*40).toFixed(1)}px) scale(${(lerp(.92,1,a)).toFixed(3)})`;
    w.style.filter=blur((1-a)*12+b*12);
  });
}
const typed=(s,lt,start,cps)=>s.slice(0,Math.max(0,Math.floor((lt-start)*cps)));
const caretOn=t=>(Math.floor(t*2.2)%2)==0?1:0;

// ---------- timeline (local t = VO time - 38.12) ----------
const S=[
 {id:'sA',a:0,b:3.42},
 {id:'sB',a:3.42,b:11.1},
 {id:'sC',a:11.1,b:25.95},
 {id:'sD',a:25.95,b:34.98},
 {id:'sE',a:34.98,b:43.25},
];
const DURATION=43.25;
const CUES=[];
ICON.spark='<path d="M12 3l2 5.5 5.5 2-5.5 2L12 18l-2-5.5-5.5-2 5.5-2z"/>';
ICON.lib='<path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 2.5 15.5-3.5 1z"/>';
ICON.doc2='<path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5"/>';
const RES=[
 ['Sponsorship briefs','12 files','doc','#ff6b6b'],
 ['Brand guidelines','6 files','spark','#a493ff'],
 ['Past & current scripts','48 files','film','#5fd8ff'],
 ['Product notes','19 files','note','#ffc857'],
 ['Campaign requirements','9 files','target','#6ee7b7'],
 ['Content calendar','Oct–Dec','cal','#7c9cff'],
 ['Performance reports','Q1–Q3','chart','#ff8a7a'],
];
const ic=(r,sz='')=>`<div class="ic" style="background:${r[3]}2b;border:1px solid ${r[3]}55;display:grid;place-items:center">${svg(r[2],'stroke:'+r[3]+sz)}</div>`;
const OK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

// ---------- A ----------
build($('aA'),"So today, I'm testing a different approach with");
CUES.push([2.25,'shimmer'],[2.25,'pop']);
function sA(lt){
  kin($('aA'),lt,.1,1e9,.06);
  const x=back(p(lt,2.15,.6)),o=eo(p(lt,2.15,.3));
  $('wm').style.opacity=o;$('wm').style.transform=`scale(${lerp(.6,1,x)})`;$('wm').style.filter=blur((1-o)*14);
  $('logo').style.transform=`rotate(${lerp(-90,0,eo5(p(lt,2.15,.8)))}deg)`;
  [['ring1',2.2],['ring2',2.38]].forEach(([id,s])=>{const r=p(lt,s,1.1);$(id).style.opacity=r>0?(1-r)*.8:0;$(id).style.transform=`scale(${lerp(.6,5,eo(r))})`});
}

// ---------- B ----------
build($('bA'),'Instead of files I just {store,}');
build($('bB'),"I'm turning them into a [resource library]");
build($('bC'),'that an [AI agent] can actually work from.');
const bdocs=RES.slice(0,6).map((r,i)=>{const d=document.createElement('div');d.className='minidoc glass';d.innerHTML=ic(r)+r[0].split(' ')[0];$('bdocs').appendChild(d);CUES.push([3.42+.35+i*.28+.45,'tick']);return d});
const GRID=i=>[(i%3-1)*214,(Math.floor(i/3)-.5)*164];
const btiles=RES.slice(0,6).map((r,i)=>{const d=document.createElement('div');d.className='tile glass';d.innerHTML=ic(r)+r[0];$('btiles').appendChild(d);CUES.push([3.42+2.75+i*.09+.3,'pop']);return d});
const blinks=RES.slice(0,6).map(()=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('stroke','#8f7dff');l.setAttribute('stroke-width','3');l.setAttribute('stroke-linecap','round');$('blinks').appendChild(l);return l});
const bdots=RES.slice(0,6).map(()=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r','6');c.setAttribute('fill','#c9f4ff');$('blinks').appendChild(c);return c});
CUES.push([3.42+5.2,'tick'],[3.42+5.1,'ding']);
function sB(lt){
  kin($('bA'),lt,.05,2.6,.06);kin($('bB'),lt,2.7,4.95,.05);kin($('bC'),lt,5.05,1e9,.05);
  // files fall into the storage box, lid shuts
  const boxIn=eo(p(lt,0,.5)),boxOut=eio(p(lt,2.65,.4));
  $('box').style.opacity=boxIn*(1-boxOut);$('box').style.transform=`scale(${lerp(.85,1,boxIn)*lerp(1,.6,boxOut)})`;
  const lidc=eo(p(lt,2.2,.3));$('lid').style.transform=`translateY(${lerp(-60,0,lidc)}px) rotate(${lerp(-28,0,lidc)}deg)`;
  bdocs.forEach((d,i)=>{const s=.35+i*.28,x=p(lt,s,.6),fall=ei(x);
    const sx=560+i*160,sy=330;const ex=960+(i-2.5)*20,ey=650;
    d.style.opacity=x<=0?0:x<1?clamp(x*5)*(1-clamp((x-.8)*5)):0;
    d.style.transform=`translate(${lerp(sx,ex,fall)}px,${lerp(sy,ey,fall)}px) rotate(${(i%2?1:-1)*20*fall}deg) scale(${lerp(1,.6,fall)})`});
  // tiles burst out of the box into a library grid, then grid slides left for the agent
  const shift=eio(p(lt,5.0,.6)),gx=lerp(960,720,shift),gy=650;
  btiles.forEach((d,i)=>{const s=2.75+i*.09,x=back(p(lt,s,.6)),[dx,dy]=GRID(i);
    d.style.opacity=clamp(p(lt,s,.2));d.style.transform=`translate(${lerp(960,gx+dx,x)}px,${lerp(650,gy+dy,x)}px) scale(${lerp(.3,1,x)})`;
    const lit=p(lt,5.3+i*.08,.4);d.style.boxShadow=lit>0?`0 0 0 2px rgba(143,125,255,${.6*lit}),0 30px 60px rgba(0,0,0,.4)`:''});
  // agent orb + links
  const ox=1480,oy=650,oo=back(p(lt,5.05,.6));
  $('borb').style.left=ox+'px';$('borb').style.top=oy+'px';$('borb').style.opacity=clamp(oo*2);$('borb').style.transform=`scale(${lerp(.3,1,oo)*(1+.03*Math.sin(lt*4))})`;
  $('borbl').style.left=ox+'px';$('borbl').style.top=(oy+100)+'px';$('borbl').style.opacity=eo(p(lt,5.4,.4));
  [['bp1',0],['bp2',.9]].forEach(([id,o])=>{const r=lt>5.3?((lt-5.3+o)%1.8)/1.8:0;const e=$(id);e.style.left=ox+'px';e.style.top=oy+'px';e.style.opacity=lt>5.3?(1-r)*.7:0;e.style.transform=`scale(${1+r*1.3})`});
  blinks.forEach((l,i)=>{const [dx,dy]=GRID(i),tx=gx+dx+95,ty=gy+dy,x=eio(p(lt,5.3+i*.08,.45));
    l.setAttribute('x1',ox);l.setAttribute('y1',oy);l.setAttribute('x2',lerp(ox,tx,x));l.setAttribute('y2',lerp(oy,ty,x));l.style.opacity=x*.55;
    const u=lt>5.8?((lt*.9+i*.17)%1):0;bdots[i].setAttribute('cx',lerp(tx,ox,u));bdots[i].setAttribute('cy',lerp(ty,oy,u));bdots[i].style.opacity=lt>5.8?Math.sin(Math.PI*u):0});
}

// ---------- C ----------
build($('cA'),'Everything I actually use as a creator → my [Library]');
$('side').innerHTML=[['spark','Agent'],['lib','Library',1],['doc2','Artifacts']].map(([k,n,on])=>`<div class="${on?'on':''}">${svg(k,on?'stroke:#a493ff':'stroke:rgba(255,255,255,.55)')}${n}</div>`).join('');
const RES_T=[5.06,6.36,7.68,9.45,10.66,12.18,13.46];
const resEls=RES.map((r,i)=>{const d=document.createElement('div');d.className='res glass';d.style.left=(i%4)*280+'px';d.style.top=Math.floor(i/4)*214+'px';
  d.innerHTML=`<div class="ok">${OK}</div>${ic(r)}<b>${r[0]}</b><small>${r[1]}</small>`;$('resgrid').appendChild(d);CUES.push([11.1+RES_T[i]+.22,'pop']);return d});
const slot=document.createElement('div');slot.className='addslot';slot.style.left=3*280+'px';slot.style.top=214+'px';slot.textContent='+ Add resource';$('resgrid').appendChild(slot);
function sC(lt){
  kin($('cA'),lt,.15,1e9,.06);
  const a=eo(p(lt,0,.8));$('app').style.opacity=a;$('app').style.transform=`translateY(${(1-a)*70}px) scale(${lerp(.94,1,a)})`;
  let n=0;
  resEls.forEach((d,i)=>{const s=RES_T[i],x=back(p(lt,s,.55));if(lt>=s+.2)n++;
    d.style.opacity=clamp(p(lt,s,.2));d.style.transform=`translateY(${(1-x)*-80}px) scale(${lerp(.7,1,x)})`;
    const ok=back(p(lt,s+.35,.4));d.firstChild.style.transform=`scale(${ok})`;
    const glow=1-p(lt,s+.2,1.2);d.style.boxShadow=lt>s?`0 0 0 2px ${RES[i][3]}${Math.round(glow*136).toString(16).padStart(2,'0')},0 30px 60px rgba(0,0,0,.4)`:''});
  slot.style.opacity=eo(p(lt,.9,.5))*(1-p(lt,13.6,.4));
  $('count').textContent=`${n} resource${n==1?'':'s'}`;
}

// ---------- D ----------
build($('dA'),'And this is the [important part.]');
build($('dB'),"I'm not just creating {another folder}");
build($('dC'),'where files go to sit forever.');
build($('dD'),'These materials become [context for the agent.]');
const zzs=[0,1,2].map(i=>{const z=document.createElement('div');z.className='zz';z.textContent='z';z.style.fontSize=(34+i*10)+'px';$('zzs').appendChild(z);return z});
const dusts=Array.from({length:22},()=>{const d=document.createElement('div');d.className='dust';$('dusts').appendChild(d);return {el:d,x:780+rnd()*360,y:500+rnd()*260,sp:.2+rnd()*.5,ph:rnd()*6}});
const DC=RES.map((r,i)=>{const a=(-90+i*360/7)*Math.PI/180;return [960+Math.cos(a)*420-90,640+Math.sin(a)*250]});
const dchips=RES.map((r,i)=>{const d=document.createElement('div');d.className='chipc glass';d.innerHTML=ic(r)+r[0];$('dchips').appendChild(d);return d});
const dlinks=RES.map(()=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('stroke','#8f7dff');l.setAttribute('stroke-width','2.5');l.setAttribute('stroke-dasharray','6 10');$('dlinks').appendChild(l);return l});
CUES.push([25.95+5.3,'tick'],[25.95+7.1,'ding']);
function sD(lt){
  kin($('dA'),lt,.05,1.5,.08);
  kin($('dB'),lt,1.72,5.15,.06);kin($('dC'),lt,2.55,5.15,.06);
  // dusty folder
  const fo=eo(p(lt,1.8,.6))*(1-eio(p(lt,5.1,.4)));
  $('dfold').style.opacity=fo;$('dfold').style.transform=`translateY(${(1-eo(p(lt,1.8,.6)))*50}px)`;$('dfold').style.filter=`grayscale(1) ${fo<1?blur((1-fo)*8):''}`;
  zzs.forEach((z,i)=>{const u=lt>2.6?((lt-2.6)*.6+i*.33)%1:0;z.style.left=(1080+u*90+i*8)+'px';z.style.top=(540-u*140)+'px';z.style.opacity=lt>2.6?Math.sin(Math.PI*u)*fo:0});
  dusts.forEach(d=>{d.el.style.left=(d.x+Math.sin(lt*d.sp+d.ph)*20)+'px';d.el.style.top=(d.y-((lt*d.sp*20)%60))+'px';d.el.style.opacity=fo*(.4+.4*Math.sin(lt*2+d.ph))});
  // context: resources connect into the agent
  kin($('dD'),lt,5.3,1e9,.05);
  const oo=back(p(lt,5.3,.6));$('dorb').style.left='960px';$('dorb').style.top='640px';$('dorb').style.opacity=clamp(oo*2);$('dorb').style.transform=`scale(${lerp(.3,1,oo)*(1+.03*Math.sin(lt*4))})`;
  [['dp1',0],['dp2',.9]].forEach(([id,o])=>{const r=lt>5.6?((lt-5.6+o)%1.8)/1.8:0;const e=$(id);e.style.left='960px';e.style.top='640px';e.style.opacity=lt>5.6?(1-r)*.7:0;e.style.transform=`scale(${1+r*1.3})`});
  dchips.forEach((d,i)=>{const s=5.45+i*.07,x=back(p(lt,s,.55));const [cx,cy]=DC[i];
    d.style.opacity=clamp(p(lt,s,.2));d.style.transform=`translate(${lerp(960,cx,x)}px,${lerp(640,cy,x)}px) scale(${lerp(.4,1,x)})`;
    const l=dlinks[i],y=eio(p(lt,6.0+i*.06,.4)),ex=cx+90;l.setAttribute('x1',960);l.setAttribute('y1',640);l.setAttribute('x2',lerp(960,ex,y));l.setAttribute('y2',lerp(640,cy,y));l.style.opacity=y*.6;l.style.strokeDashoffset=lt*40});
  const lb=back(p(lt,7.1,.5));$('dlbl').style.left='960px';$('dlbl').style.top='735px';$('dlbl').style.opacity=clamp(lb*2);$('dlbl').style.transform=`scale(${lerp(.6,1,lb)})`;
}

// ---------- E ----------
build($('eA'),'So instead of constantly thinking…');
build($('eB'),'I can simply tell it [what I’m trying to accomplish.]');
build($('eQ'),'“Which files do I need to give the AI {this time?}”');
const eorb=RES.map((r,i)=>{const d=document.createElement('div');d.className='minidoc glass';d.innerHTML=ic(r)+r[0].split(' ')[0];$('eorbit').appendChild(d);return d});
const qms=[0,1,2].map(i=>{const q=document.createElement('div');q.className='qm';q.textContent='?';$('eorbit').appendChild(q);return q});
const ASK='Help me plan what I need to deliver this week';
for(let i=0;i<ASK.length;i+=2)CUES.push([34.98+5.7+i/36,'key']);
CUES.push([34.98+7.0,'pop']);
const ESHORT=['Briefs','Guidelines','Scripts','Product notes','Requirements','Calendar','Reports'];
const echips=RES.map((r,i)=>{const d=document.createElement('div');d.className='chipc glass';d.style.position='relative';d.style.margin='0';d.innerHTML=ic(r)+ESHORT[i];$('echips').appendChild(d);CUES.push([34.98+7.15+i*.07+.2,'tick']);return d});
function sE(lt){
  kin($('eA'),lt,.1,5.3,.06);kin($('eB'),lt,5.45,1e9,.05);
  // thought bubble with the question, files orbiting in confusion
  const tb=back(p(lt,1.0,.6)),tout=eio(p(lt,5.25,.45));
  $('thought').style.opacity=clamp(tb*2)*(1-tout);$('thought').style.transform=`scale(${lerp(.6,1,tb)*lerp(1,.8,tout)})`;
  ['td1','td2'].forEach((id,i)=>{const x=back(p(lt,.7+i*-.15,.5));$(id).style.opacity=clamp(x*2)*(1-tout);$(id).style.transform=`scale(${x})`});
  kin($('eQ'),lt,2.55,1e9,.07);
  eorb.forEach((d,i)=>{const a=lt*.5+i*Math.PI*2/7,x=eo(p(lt,1.4+i*.06,.6));
    d.style.opacity=x*(1-tout)*.9;d.style.transform=`translate(${960+Math.cos(a)*650}px,${555+Math.sin(a)*300}px) rotate(${Math.sin(lt*2+i)*10}deg) scale(${lerp(.4,.9,x)})`});
  qms.forEach((q,i)=>{const u=lt>2?((lt-2)*.7+i*.33)%1:0;q.style.left=(520+i*420)+'px';q.style.top=(380-u*60)+'px';q.style.opacity=lt>2?Math.sin(Math.PI*u)*(1-tout):0});
  // ask bar: just state the goal
  const ab=back(p(lt,5.45,.55));$('ask').style.opacity=clamp(ab*2);$('ask').style.transform=`scale(${lerp(.7,1,ab)})`;
  $('askt').textContent=typed(ASK,lt,5.7,36);$('askc').style.opacity=lt<7.0?caretOn(lt):0;
  const sp=p(lt,7.0,.3);$('send').style.transform=`scale(${1-.2*Math.sin(Math.PI*sp)})`;
  // library resources get pulled in automatically
  echips.forEach((d,i)=>{const s=7.15+i*.07,x=back(p(lt,s,.45));
    d.style.opacity=clamp(p(lt,s,.2));d.style.transform=`translateY(${lerp(110,0,x)}px) scale(${lerp(.6,1,x)})`;
    d.style.boxShadow=lt>s+.2?`0 0 0 2px ${RES[i][3]}88`:''});
}

// ---------- background / grain ----------
const gctx=$('grain').getContext('2d');const noise=[];
for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d');const im=x.createImageData(480,270);
  for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);noise.push(c)}
const stress=t=>.15*(p(t,26.5,1)*(1-p(t,31,1))+p(t,35,1)*(1-p(t,40.5,1)));
function bg(t){
  const g1=$('g1'),g2=$('g2'),g3=$('g3');
  g1.style.background='radial-gradient(circle,rgba(124,92,255,.32),transparent 60%)';
  g2.style.background='radial-gradient(circle,rgba(34,211,238,.20),transparent 60%)';
  g3.style.background='radial-gradient(circle,rgba(255,107,107,.30),transparent 60%)';
  g1.style.transform=`translate(${560+Math.sin(t*.21)*220}px,${300+Math.cos(t*.17)*160}px)`;
  g2.style.transform=`translate(${1420+Math.cos(t*.19)*200}px,${800+Math.sin(t*.23)*140}px)`;
  g3.style.transform=`translate(${960+Math.sin(t*.3)*300}px,${540+Math.cos(t*.25)*120}px)`;g3.style.opacity=stress(t);
  $('grid').style.transform=`translate(${(t*6)%44}px,${(t*3)%44}px)`;
  gctx.imageSmoothingEnabled=false;gctx.drawImage(noise[Math.floor(t*24)%6],0,0,1920,1080);
}

// ---------- master render ----------
const FN={sA,sB,sC,sD,sE};
function render(t){
  bg(t);
  S.forEach((s,i)=>{
    const el=$(s.id);
    if(t<s.a-.01||t>s.b+.01){el.style.opacity=0;el.style.visibility='hidden';return}
    el.style.visibility='visible';
    const lt=t-s.a,last=i==S.length-1;
    const inn=i==0?eo(p(t,0,.6)):eo(p(t,s.a,.55));
    const out=last?0:ei(p(t,s.b-.45,.45));
    el.style.opacity=(inn*(1-out)).toFixed(3);
    el.style.transform=`scale(${(lerp(1.06,1,inn)*lerp(1,.94,out)*(1+lt*.0035)).toFixed(4)})`;
    el.style.filter=blur((1-inn)*14+out*14);
    FN[s.id](lt);
  });
  $('fade').style.opacity=0;
}
window.render=render;window.DURATION=DURATION;window.CUES=CUES.sort((a,b)=>a[0]-b[0]);
// preview mode: open the file directly in a browser to watch it play
if(!location.search.includes('capture')){
  document.fonts.ready.then(()=>{const t0=performance.now();const loop=()=>{render(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop)};loop()});
}
</script>
